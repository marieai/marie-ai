    "pytest<8.0.0",
    "pytest-timeout",
    "pytest-mock",
    "pytest-cov==3.0.0",
    "coverage==6.2",
    "pytest-repeat",
    "pytest-asyncio<0.23.0",
    "pytest-reraise",
    "mock",
    "requests-mock",
    "pytest-custom_exit_code",
    "black==24.3.0",
    "kubernetes>=18.20.0,<31.0.0",
    "pytest-kind==22.11.1",
    "pytest-lazy-fixture",
    "psutil",
    "uvloop",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-grpc>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20.0",
    "opentelemetry-semantic-conventions>=0.41b0",
    "opentelemetry-instrumentation-aiohttp-client>=0.41b0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "openinference-instrumentation>=0.1.46",
    "fastapi>=0.100.1",
    "uvicorn[standard]>=0.23.1",
    "docker",
    "pathspec",
    "filelock",
    "requests",
    "websockets",
    "python-multipart",
    "aiofiles",
    "aiohttp",
    "aiostream",
    "strawberry-graphql>=0.96.0",
    "watchfiles>=0.18.0",
    "gradio",
    "python-dotenv",
]

legacy-gradio = [
    "gradio",
    "openai",
    "timm==1.0.27",
    "nltk",
]

[tool.isort]
profile = "black"
line_length = 127
multi_line_output = 3
include_trailing_comma = true
virtual_env = "venv"

[tool.black]
line-length = 88
target-version = ["py312"]
include = "\\.pyi?$"
preview = false
skip-string-normalization = true
exclude = """
/(
      .eggs
    | .git
    | .hg
    | .mypy_cache
    | .tox
    | venv
    | _build
    | buck-out
    | build
    | dist
  )/
"""
