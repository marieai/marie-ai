    "diskcache",
    "tenacity",
    "json_repair",
    "watchdog",
    "cachetools==5.5.0",
    "portalocker==3.2.0",
    "jsonpath-ng",
    "clickhouse-driver==0.2.10",
    "python-dotenv",
    "a2a-sdk>=0.3.9",
    "beautifulsoup4>=4.12.3",
    "pillow-heif",
    "pdf2image",
    "grpcio>=1.60.0,<1.66.0",
    "grpcio-reflection>=1.60.0,<1.66.0",
    "grpcio-health-checking>=1.60.0,<1.66.0",
    "docarray>=0.30,<=0.40.0",
    "mcp>=1.6.0",
    "pydantic>=2.11.0",
    "pydantic-settings>=2.0.0",
    "urllib3>=1.25.9,<2.0.0",
    "etcd3==0.12.0",
    "fastwer==0.1.3",
