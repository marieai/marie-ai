]

legacy-gradio = [
    "gradio",
    "openai",
    "timm==1.0.27",
    "nltk",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "I"]
ignore = ["ASYNC109"]
fixable = ["I"]
exclude = [
    "marie/boxes/dit/**",
    "marie/core/**",
    "marie/models/**",
    "marie/proto/docarray_v1/**",
    "marie/proto/docarray_v2/**",
    "marie/resources/**",
    "marie/storage/**",
]

[tool.ruff.lint.per-file-ignores]
"hubble/resources/**" = ["E9", "F63", "F7", "F82"]
"marie/helloworld/**" = ["I"]
"marie/proto/pb/jina_pb2.py" = ["I"]
"marie/proto/pb/jina_pb2_grpc.py" = ["I"]
"marie/proto/pb2/jina_pb2.py" = ["I"]
"marie/proto/pb2/jina_pb2_grpc.py" = ["I"]
"marie/serve/consensus/**" = ["E9", "F63", "F7", "F82"]
"marie/utils/patches.py" = ["E9", "F63", "F7", "F82"]
"old/**" = ["E9", "F63", "F7", "F82"]
"tests/**" = ["E9", "F63", "F7", "F82"]

[tool.ruff.format]
quote-style = "preserve"
docstring-code-format = true
exclude = [
    "hubble/resources/**",
    "marie/boxes/dit/**",
    "marie/core/**",
    "marie/models/**",
    "marie/proto/docarray_v1/**",
    "marie/proto/docarray_v2/**",
    "marie/resources/**",
    "marie/storage/**",
    "tests/**",
]
