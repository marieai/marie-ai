    "marie-mem0",
    "marie-mcp",
]

[project.optional-dependencies]
cu130 = [
    "vllm==0.23.1rc1.dev737+g11840796b",
    "transformers==5.13.0",
    "pycocotools",
    "timm==1.0.27",
    "onnx",
    "sentencepiece",
    "fast_pytorch_kmeans",
    "sahi",
    "openai-clip",
    "efficientnet-pytorch",
    "sentence-transformers==5.6.0",
    "qwen-vl-utils==0.0.14",
    "peft==0.19.1",
    "ruamel.yaml",
    "graphviz",
    "networkx",
    "nameparser",
    "prettytable",
    "fairseq==0.12.2+marieai.torch212cu130",
    "detectron2==0.6",
    "faiss-gpu-cu13==1.14.1+cu130",
    "torch==2.12.1",
    "torchvision==0.27.1",
]

[project.urls]
Documentation = "https://docs.marieai.co"
Source = "https://github.com/marieai/marie-ai.git"
Tracker = "https://github.com/marieai/marie-ai/issues"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = { attr = "marie._version.__version__" }

[tool.setuptools.packages.find]
namespaces = true
include = [
    "hubble*",
    "marie*",
    "marie_server*",
]
exclude = [
    "tests*",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
etcd3 = { path = "wheels/etcd3-0.12.0-py2.py3-none-any.whl" }
fastwer = { path = "wheels/fastwer-0.1.3-cp312-cp312-linux_x86_64.whl" }
fairseq = { path = "wheels/fairseq-0.12.2+marieai.torch212cu130-cp312-cp312-linux_x86_64.whl" }
detectron2 = { path = "wheels/detectron2-0.6-cp312-cp312-linux_x86_64.whl" }
faiss-gpu-cu13 = { path = "wheels/faiss_gpu_cu13-1.14.1+cu130-py3-none-any.whl" }
vllm = { path = "wheels/vllm-0.23.1rc1.dev737+g11840796b-cp312-cp312-linux_x86_64.whl" }
marie-kernel = { path = "packages/marie-kernel", editable = true }
marie-extension = { path = "packages/marie-extension", editable = true }
marie-instrumentation = { path = "packages/marie-instrumentation", editable = true }
marie-agent = { path = "packages/marie-agent", editable = true }
marie-engine = { path = "packages/marie-engine", editable = true }
marie-wasm = { path = "packages/marie-wasm", editable = true }
marie-mem0 = { path = "packages/marie-mem0", editable = true }
marie-mcp = { path = "packages/marie-mcp", editable = true }
marie-cli = { path = "packages/marie-cli", editable = true }
torch = [
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[dependency-groups]
gateway = [
    "aiofiles",
    "aiohttp",
    "aiostream",
    "boto3",
    "cachetools==5.5.0",
    "diskcache",
