    "fairseq==0.12.2+marieai.torch212cu130",
    "detectron2==0.6",
    "faiss-gpu-cu13==1.14.1+cu130",
]

marie-cuda = [
    { include-group = "marie-runtime-common" },
    { include-group = "marie-cuda-extra" },
    { include-group = "marie-local-wheel-common" },
    { include-group = "marie-local-package-deps" },
    { include-group = "marie-cuda-native-wheels" },
    "torch==2.12.1",
    "torchvision==0.27.1",
]

