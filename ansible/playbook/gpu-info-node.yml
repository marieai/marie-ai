---
- name: Marie-AI Cluster - GPU Info
  hosts: ml_cluster
  gather_facts: false

  tasks:
  - name: NVIDIA GPU Info
    ansible.builtin.shell: |
        docker run --rm --runtime=nvidia --gpus all nvidia/cuda:12.2.0-runtime-ubuntu22.04 nvidia-smi
    register: out
    become_method: sudo
  - debug: var=out.stdout_lines
