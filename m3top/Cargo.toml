[package]
name = "m3top"
version = "0.2.0"
edition = "2024"
description = "Operational terminal for Marie Runtime Fabric"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6.0"
fastrand = "2.3"
futures-util = "0.3"
prost = "0.14"
prost-types = "0.14"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.49", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1"
toml = "0.9"
tonic = { version = "0.14", default-features = false, features = ["channel", "codegen", "tls-aws-lc", "tls-webpki-roots"] }
tonic-prost = "0.14"

[build-dependencies]
protox = "0.9"
tonic-prost-build = { version = "0.14", default-features = false }

[dev-dependencies]
pretty_assertions = "1.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
