# Enable queued dispatch with LLM_QUEUE_ENABLED=true and LLM_QUEUE_URL.
# Provision endpoint credentials, lanes, limits, and consistent fabric identity before startup.
# Quiesce old writers, drain old queues, and affirmatively settle remote calls before cutover.
fabric_group_id: example-fabric
llm_dispatch:
  policy: drr
  total_concurrent_dispatch: 8
  limits:
    max_execution_items: 8
    max_execution_bytes: 67108864
  endpoints:
    - endpoint_id: primary
      base_url: https://inference.example/v1
      credential_env: PRIMARY_INFERENCE_API_KEY
      allow_private: false
      allow_loopback: false
      enabled: true
      execution_limit: 8
      execution_bytes: 67108864
      call_timeout_seconds: 60
      max_response_bytes: 1048576
      retry_429: false
  lanes:
    - pool_id: default
      endpoint_id: primary
      revision: r1
      enabled: true
      execution_limit: 8
      execution_bytes: 67108864
