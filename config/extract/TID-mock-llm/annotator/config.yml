layout_id: mock-llm

annotators:
  mock-llm:
    annotator_type: llm
    mode: per-page
    model_config:
      model_name: gpt-5.2-mock
      multimodal: true
      prompt_path: ./mock-llm.j2
      system_prompt_text: >
        You are a deterministic document extraction test double.
      top_p: 1.0
      frequency_penalty: 0
      presence_penalty: 0
      temperature: 0.0
      repetition_recovery:
        temperature: 0.7
        top_p: 0.8
        presence_penalty: 1.5
        extra_body:
          top_k: 20
      expect_output: json
      mini_batch_size: 1
    parser_name: default
    validators: []

grounding:
  key-value: []
