[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marie-instrumentation"
version = "0.1.0"
description = "OpenTelemetry and OpenInference instrumentation for Marie runtimes"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Marie AI", email = "support@marieai.co"},
]
keywords = ["marie", "opentelemetry", "openinference", "observability", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openinference-instrumentation>=0.1.46",
    "openinference-semantic-conventions>=0.1.30",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-otlp>=1.20.0",
]

[project.optional-dependencies]
token-counting = ["tiktoken>=0.7.0"]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/marieai/marie-ai"
Documentation = "https://docs.marieai.co"
Repository = "https://github.com/marieai/marie-ai"
Issues = "https://github.com/marieai/marie-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/marie"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E402", "E501"]
