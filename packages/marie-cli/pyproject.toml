[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marie-cli"
version = "0.1.0"
description = "Command-line interface for Marie AI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Marie AI", email = "support@marieai.co"},
]
keywords = ["marie", "cli", "gateway", "executor"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "marie-ai>=5.0.0,<6.0.0",
    "rich>=13.0.0",
]

[project.scripts]
marie = "marie.cli:main"

[project.urls]
Homepage = "https://github.com/marieai/marie-ai"
Documentation = "https://docs.marieai.co"
Repository = "https://github.com/marieai/marie-ai"
Issues = "https://github.com/marieai/marie-ai/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.11.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marie"]

[tool.uv.sources]
marie-ai = {path = "../..", editable = true}

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
