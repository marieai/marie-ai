[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marie-engine"
version = "0.1.0"
description = "Reusable model execution engine for the Marie PEP 420 namespace"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "Apache-2.0"}
authors = [
    {name = "Marie AI", email = "support@marieai.co"},
]
keywords = ["marie", "llm", "inference", "engine", "openai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "diskcache>=5.6.0",
    "json-repair>=0.30.0",
    "marie-instrumentation",
    "openinference-semantic-conventions>=0.1.30",
    "opentelemetry-api>=1.20.0",
    "pillow>=11.0,<13",
    "platformdirs>=4.0.0",
    "pydantic>=2.11.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
openai = [
    "openai>=1.0.0",
    "tenacity>=8.0.0",
    "tiktoken>=0.7.0",
    "torch>=2.1.0",
]
agent = ["marie-agent"]
transformers = [
    "torch>=2.1.0",
    "transformers>=4.49.0",
]
queue = ["valkey>=6.0.0"]
dev = [
    "marie-agent",
    "openai>=1.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.11.0",
    "tenacity>=8.0.0",
    "torch>=2.1.0",
    "valkey>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/marieai/marie-ai"
Documentation = "https://docs.marieai.co"
Repository = "https://github.com/marieai/marie-ai"
Issues = "https://github.com/marieai/marie-ai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/marie"]

[tool.uv.sources]
marie-agent = {path = "../marie-agent", editable = true}
marie-instrumentation = {path = "../marie-instrumentation", editable = true}

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
