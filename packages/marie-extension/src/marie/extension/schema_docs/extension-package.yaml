apiVersion: marie.ai/v1alpha1
kind: ExtensionPackage
metadata:
  id: ext.example.tool
  name: example-tool
  version: 0.1.0
  displayName: Example Tool
runtime:
  type: metadata_only
runtimePolicy:
  timeoutMs: 30000
  maxConcurrent: 1
  maxMemoryBytes: 536870912
  networkPolicy: none
permissions:
  network:
    enabled: false
providers:
  - ref: provider/example
    type: tool_provider
    displayName: Example
    tools:
      - ref: tools/example
        name: example
        invocationSchema:
          parameters:
            - key: query
              type: string
              x-marie-form: llm
  - ref: provider/repair
    type: agent_strategy_provider
    agents:
      - ref: agents/repair
        name: repair
        invocationSchema:
          required: [page_file]
          parameters:
            - key: page_file
              type: string
        output:
          schema:
            type: object
        modelCapabilities: [vision, tool_calling]
