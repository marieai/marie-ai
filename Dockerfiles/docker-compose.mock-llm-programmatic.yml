# Marie AI - Programmatic Mock LLM Server
#
# This compose file runs the programmatic AIMock server with custom handlers.
# Use this when you need dynamic mock responses based on request content.
#
# Usage:
#   docker compose -f docker-compose.mock-llm-programmatic.yml up -d
#
# For fixture-based mocking (simpler, no code):
#   docker compose -f docker-compose.mock-llm.yml up -d

services:
  aimock-programmatic:
    build:
      context: ./aimock/programmatic
      dockerfile: Dockerfile
    container_name: marie-aimock-programmatic
    ports:
      - "${AIMOCK_PORT:-4010}:4010"
      - "${AIMOCK_ADMIN_PORT:-4011}:4011"
    environment:
      - AIMOCK_PORT=${AIMOCK_PORT:-4010}
      - AIMOCK_ADMIN_PORT=${AIMOCK_ADMIN_PORT:-4011}
      - AIMOCK_FAULT_PROFILE=${AIMOCK_FAULT_PROFILE:-normal}
      - AIMOCK_TIMEOUT_MS=${AIMOCK_TIMEOUT_MS:-180000}
      - AIMOCK_CHAOS_ERROR_RATE=${AIMOCK_CHAOS_ERROR_RATE:-0.15}
      - AIMOCK_CHAOS_TIMEOUT_RATE=${AIMOCK_CHAOS_TIMEOUT_RATE:-0.15}
      - AIMOCK_CHAOS_SLOW_RATE=${AIMOCK_CHAOS_SLOW_RATE:-0.20}
      - AIMOCK_CHAOS_SLOW_MS=${AIMOCK_CHAOS_SLOW_MS:-5000}
      - NODE_ENV=development
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - marie_default
    labels:
      - "com.marie-ai.service=aimock-programmatic"
      - "com.marie-ai.description=Programmatic mock LLM server with custom handlers"

networks:
  marie_default:
    external: true
