# Add to docker-compose.clickhouse.yml only when provisioning the SQL explorer.
services:
  clickhouse-query-schema:
    image: clickhouse/clickhouse-server:25.12.1.649@sha256:7234d193fbeb3a375f21f0bb99040396f68bb2e82cada4f4947d7fcf9638bbf3
    profiles: [query-explorer]
    restart: "no"
    entrypoint: [/bin/sh, /query-explorer/bootstrap.sh]
    environment:
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_ADMIN_PASSWORD_FILE: /run/secrets/query_bootstrap
      QUERY_READER_PASSWORD_FILE: /run/secrets/query_reader
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./config/clickhouse/query-explorer:/query-explorer:ro
    secrets: [query_reader, query_bootstrap]
    networks: [marie_default]

secrets:
  query_reader:
    file: ${STUDIO_QUERY_PASSWORD_FILE:?Set the reader Secret file path}
  query_bootstrap:
    file: ${CLICKHOUSE_ADMIN_PASSWORD_FILE:?Set the bootstrap Secret file path}
