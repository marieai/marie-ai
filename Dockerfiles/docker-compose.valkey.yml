# ############### Valkey - LLM Queue Store ###############
#
# Used by: marie-ai LLM queue submitters and dispatchers
#
# Valkey provides the shared request/reply transport for the Phase 1
# best-effort queued batch execution path.
#
# Prerequisites:
#   - Network created: docker network create --driver=bridge marie_default
#   - Security material prepared as described in Dockerfiles/valkey/README.md
#
# Access:
#   - Valkey: authenticated redis:// connection on port 6379

services:
  valkey:
    image: valkey/valkey:9-alpine
    init: true
    restart: unless-stopped
    container_name: "marie-valkey"
    command: ["sh", "/etc/valkey/start.sh"]
    ports:
      - 6379:6379
    volumes:
      - valkey_data:/data
      - type: bind
        source: ./Dockerfiles/valkey
        target: /etc/valkey
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VALKEY_SECURITY_DIR:-${DATA_DIR:-/mnt/data/marie-ai}/valkey-security}/server
        target: /run/valkey-source
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run/valkey:rw,noexec,nosuid,size=1m
    healthcheck:
      test: ["CMD", "sh", "/etc/valkey/healthcheck.sh"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "marie.service=valkey"
      - "marie.description=Valkey request/reply store for LLM queueing"
    networks:
      - marie_default

volumes:
  valkey_data:
    driver: local

networks:
  marie_default:
    external: true
