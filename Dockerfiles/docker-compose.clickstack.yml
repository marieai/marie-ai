# ############### ClickStack - Observability Stack powered by ClickHouse ###############
#
# Used by: marie-ai monitoring and error tracking
#
# Architecture:
#   Applications -> OTLP -> OTel Collector -> marie-clickhouse -> Studio Dashboard
#
# Components:
#   - otel-collector: Receives OTLP and exports to ClickHouse
#   - log-collector: Collects Docker container logs
#   - hyperdx (optional): Observability UI connected to external ClickHouse (state in marie-psql-server)
#
# Prerequisites:
#   - Network: docker network create --driver=bridge marie_default
#   - ClickHouse: docker-compose.clickhouse.yml must be running
#   - Storage: docker-compose.storage.yml must be running (marie-psql-server provides the native DocumentDB gateway for HyperDX state)
#   - Schema: Bootstrap the ClickHouse telemetry schema before starting ClickStack
#
# Usage:
#   # Core stack (collector only)
#   docker compose --env-file ./config/.env.dev -f ./Dockerfiles/docker-compose.clickstack.yml --project-directory . up -d
#
#   # With HyperDX UI (optional)
#   docker compose --env-file ./config/.env.dev -f ./Dockerfiles/docker-compose.clickstack.yml --project-directory . --profile ui up -d
#
# Access:
#   - OTLP gRPC: localhost:4317
#   - OTLP HTTP: localhost:4318
#   - HyperDX UI (optional): http://localhost:8080

services:
  # ############### OTel Collector - Telemetry Ingestion ###############
  # Receives OTLP data and exports to ClickHouse
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.149.0
    container_name: marie-otel-collector
    restart: unless-stopped
    # Keep collector output out of /var/lib/docker/containers/*-json.log so the
    # log-collector does not ingest it (docker logs still works)
    logging:
      driver: local
    command: ["--config=/etc/otel/config.yml"]
    environment:
      - CLICKHOUSE_USERNAME=${CLICKHOUSE_USER:-marie}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - DEPLOYMENT_ENV=${STACK_NAME:-dev}
    volumes:
      - ${PWD}/config/clickstack/otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"        # OTLP gRPC receiver
      - "${OTEL_HTTP_PORT:-4318}:4318"        # OTLP HTTP receiver
      - "8889:8889"                            # Prometheus metrics
    networks:
      - marie_default
    # Note: otel-collector-contrib image is minimal (no curl/wget)
    # Health is verified by the collector's internal health_check extension
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${OTEL_COLLECTOR_MEMORY_LIMIT:-1G}
        reservations:
          memory: ${OTEL_COLLECTOR_MEMORY_RESERVATION:-256M}

  # ############### Log Collector Sidecar ###############
  # Collects Docker container logs and forwards to OTel Collector
  log-collector:
    image: otel/opentelemetry-collector-contrib:0.149.0
    container_name: marie-log-collector
    restart: unless-stopped
    # Keep collector output out of /var/lib/docker/containers/*-json.log so the
    # log-collector does not ingest it (docker logs still works)
    logging:
      driver: local
    command: ["--config=/etc/otel/config.yml"]
    user: "0:0"  # Run as root to read Docker logs
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://marie-otel-collector:4318
      - DEPLOYMENT_ENV=${STACK_NAME:-dev}
    volumes:
      - ${PWD}/config/clickstack/log-collector-config.yml:/etc/otel/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - marie_default
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${LOG_COLLECTOR_MEMORY_LIMIT:-256M}

  # ############### HyperDX (Optional) ###############
  # Observability UI connected to external marie-clickhouse
  # Uses the native DocumentDB gateway on marie-psql-server for state storage
  # Only starts with --profile ui
  hyperdx:
    image: docker.hyperdx.io/hyperdx/hyperdx:latest
    container_name: marie-hyperdx
    restart: unless-stopped
    profiles:
      - ui
    # Lets HyperDX reach the M3 Forge API on the Docker host as "marie-studio", so alert webhooks
    # can be sent back to it (http://marie-studio:3500/api/alert-callbacks). The host resolves the
    # same name through /etc/hosts, so one URL works from both sides. A literal private IP or
    # "localhost" would be rejected by HyperDX's webhook URL validation; a hostname is not.
    extra_hosts:
      - "marie-studio:host-gateway"
    environment:
      # Native DocumentDB gateway credentials are separate from the SQL administrator.
      - MONGO_URI=mongodb://${DOCUMENTDB_USERNAME:-marie}:${DOCUMENTDB_PASSWORD:-${POSTGRES_PASSWORD}}@marie-psql-server:27017/hyperdx?authMechanism=SCRAM-SHA-256
      - HYPERDX_LOG_LEVEL=${HYPERDX_LOG_LEVEL:-info}
      - HYPERDX_APP_PORT=${HYPERDX_APP_PORT:-8080}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:${HYPERDX_UI_PORT:-8080}}
    ports:
      - "${HYPERDX_UI_PORT:-8080}:8080"       # HyperDX Web UI
      - "${HYPERDX_OTEL_PORT:-4327}:4317"     # HyperDX OTLP gRPC (separate from main collector)
      - "${HYPERDX_OTEL_HTTP_PORT:-4328}:4318" # HyperDX OTLP HTTP
    networks:
      - marie_default
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${HYPERDX_MEMORY_LIMIT:-2G}
        reservations:
          memory: ${HYPERDX_MEMORY_RESERVATION:-512M}

networks:
  marie_default:
    external: true

# ############### Setup Instructions ###############
#
# 1. Start ClickHouse first:
#    docker compose --project-directory . --env-file ./config/.env.dev -f ./Dockerfiles/docker-compose.clickhouse.yml up -d --wait clickhouse
#
# 2. Apply the OTel schema:
#    docker compose --project-directory . --env-file ./config/.env.dev -f ./Dockerfiles/docker-compose.clickhouse.yml --profile schema run --rm --no-deps clickhouse-query-schema
#
# 3. Start ClickStack (core):
#    docker compose --env-file ./config/.env.dev -f ./Dockerfiles/docker-compose.clickstack.yml up -d
#
# 4. (Optional) Start with HyperDX UI:
#    Start the fresh PostgreSQL 17 / DocumentDB 1.2 storage service first and wait for it to be healthy.
#    DOCUMENTDB_USERNAME defaults to marie; DOCUMENTDB_PASSWORD defaults to POSTGRES_PASSWORD.
#    docker compose --env-file ./config/.env.dev -f ./Dockerfiles/docker-compose.clickstack.yml --profile ui up -d
#
# 5. (First-time only) Initialize HyperDX admin user:
#    ./scripts/hyperdx-init-user.sh
#    Or with custom credentials:
#    HYPERDX_ADMIN_EMAIL=you@example.com HYPERDX_ADMIN_PASSWORD=secret ./scripts/hyperdx-init-user.sh
#
# 6. (First-time only) Configure HyperDX → ClickHouse connection:
#    Open http://localhost:8080, go to Team Settings → Connections, add ClickHouse:
#      Host: marie-clickhouse    Port: 8123
#      Username: marie           Password: marie123
#      Database: telemetry
#
# 6. Configure Gateway to send metrics:
#    marie gateway --uses config/service/gateway.yml \
#      --metrics --metrics-exporter-host localhost --metrics-exporter-port 4317
#
# 7. View metrics in Studio:
#    http://localhost:3000/infrastructure
