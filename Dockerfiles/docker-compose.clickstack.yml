# ############### ClickStack - Observability Stack powered by ClickHouse ###############
#
# Used by: marie-ai monitoring and error tracking
#
# Architecture:
#   Applications -> OTLP -> OTel Collector -> marie-clickhouse -> Studio Dashboard
#
# Components:
#   - otel-collector: Receives OTLP and exports to ClickHouse
#   - log-collector: Collects Docker container logs
#   - hyperdx-local (optional): Bundled UI for ad-hoc exploration
#
# Prerequisites:
#   - Network: docker network create --driver=bridge marie_default
#   - ClickHouse: docker-compose.clickhouse.yml must be running
#   - Schema: Apply schema/observability.sql to marie-clickhouse
#
# Usage:
#   # Core stack (collector only)
#   docker compose --env-file ./config/.env.dev -f ./Dockerfiles/docker-compose.clickstack.yml --project-directory . up -d
#
#   # With HyperDX UI (optional)
#   docker compose --env-file ./config/.env.dev -f ./Dockerfiles/docker-compose.clickstack.yml --project-directory . --profile ui up -d
#
# Access:
#   - OTLP gRPC: localhost:4317
#   - OTLP HTTP: localhost:4318
#   - HyperDX UI (optional): http://localhost:8080

services:
  # ############### OTel Collector - Telemetry Ingestion ###############
  # Receives OTLP data and exports to ClickHouse
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.149.0
    container_name: marie-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    environment:
      - DEPLOYMENT_ENV=${STACK_NAME:-dev}
    volumes:
      - ./config/clickstack/otel-collector-config.yml:/etc/otel/config.yml:ro
    ports:
      - "${OTEL_GRPC_PORT:-4317}:4317"        # OTLP gRPC receiver
      - "${OTEL_HTTP_PORT:-4318}:4318"        # OTLP HTTP receiver
      - "8889:8889"                            # Prometheus metrics
    networks:
      - marie_default
    # Note: otel-collector-contrib image is minimal (no curl/wget)
    # Health is verified by the collector's internal health_check extension
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${OTEL_COLLECTOR_MEMORY_LIMIT:-512M}
        reservations:
          memory: ${OTEL_COLLECTOR_MEMORY_RESERVATION:-128M}

  # ############### Log Collector Sidecar ###############
  # Collects Docker container logs and forwards to OTel Collector
  log-collector:
    image: otel/opentelemetry-collector-contrib:0.149.0
    container_name: marie-log-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/config.yml"]
    user: "0:0"  # Run as root to read Docker logs
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://marie-otel-collector:4318
      - DEPLOYMENT_ENV=${STACK_NAME:-dev}
    volumes:
      - ./config/clickstack/log-collector-config.yml:/etc/otel/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - marie_default
    depends_on:
      otel-collector:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: ${LOG_COLLECTOR_MEMORY_LIMIT:-256M}

  # ############### HyperDX Local (Optional) ###############
  # Self-contained observability UI with bundled storage
  # Only starts with --profile ui
  hyperdx-local:
    image: docker.hyperdx.io/hyperdx/hyperdx-local:latest
    container_name: marie-hyperdx
    restart: unless-stopped
    profiles:
      - ui
    environment:
      - HYPERDX_LOG_LEVEL=${HYPERDX_LOG_LEVEL:-info}
    ports:
      - "${HYPERDX_UI_PORT:-8080}:8080"       # HyperDX Web UI
      - "${HYPERDX_OTEL_PORT:-4327}:4317"     # HyperDX OTLP gRPC (separate from main collector)
      - "${HYPERDX_OTEL_HTTP_PORT:-4328}:4318" # HyperDX OTLP HTTP
    networks:
      - marie_default
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: ${HYPERDX_MEMORY_LIMIT:-2G}
        reservations:
          memory: ${HYPERDX_MEMORY_RESERVATION:-512M}

networks:
  marie_default:
    external: true

# ############### Setup Instructions ###############
#
# 1. Start ClickHouse first:
#    docker compose --env-file ./config/.env.dev -f ./Dockerfiles/docker-compose.clickhouse.yml up -d
#
# 2. Apply the OTel schema:
#    docker exec -i marie-clickhouse clickhouse-client < config/clickstack/schema/observability.sql
#
# 3. Start ClickStack (core):
#    docker compose --env-file ./config/.env.dev -f ./Dockerfiles/docker-compose.clickstack.yml up -d
#
# 4. (Optional) Start with HyperDX UI:
#    docker compose --env-file ./config/.env.dev -f ./Dockerfiles/docker-compose.clickstack.yml --profile ui up -d
#
# 5. Configure Gateway to send metrics:
#    marie gateway --uses config/service/gateway.yml \
#      --metrics --metrics-exporter-host localhost --metrics-exporter-port 4317
#
# 6. View metrics in Studio:
#    http://localhost:3000/infrastructure
