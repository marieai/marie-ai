# ############### PostgreSQL - DocumentDB Compatible ###############
#
# Used by: marie-ai, gitea, litellm
#
# PostgreSQL with DocumentDB extensions for document storage and querying.
#
# Prerequisites:
#   - Network created: docker network create --driver=bridge marie_default
#
# Usage:
#   docker compose --env-file ./config/.env -f ./Dockerfiles/docker-compose.storage.yml --project-directory . up -d
#
# Access:
#   - PostgreSQL: localhost:5432
#   - Native DocumentDB gateway: localhost:27017

services:
  psql:
    container_name: marie-psql-server
    init: true
    shm_size: 1gb
    image: marieai/postgres-documentdb:17-1.2.0
    build:
      context: ./Dockerfiles/postgres
    pull_policy: build
    restart: on-failure
    ports:
      - "5432:5432"
      - "127.0.0.1:${DOCUMENTDB_PORT:-27017}:27017"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=postgres
      - DOCUMENTDB_USERNAME=${DOCUMENTDB_USERNAME:-marie}
      - DOCUMENTDB_PASSWORD=${DOCUMENTDB_PASSWORD:-${POSTGRES_PASSWORD}}
    volumes:
      - documentdb_data:/data
      - ./config/psql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - marie_default
    healthcheck:
      test: ["CMD", "/usr/local/bin/marie-documentdb-healthcheck"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 120s
volumes:
  documentdb_data:
    driver: local

## ############### Networks ###############
networks:
  marie_default:
    external: true


# ############### Docker Compose Commands ###############

# docker compose  --env-file ./config/.env  -f ./Dockerfiles/docker-compose.storage.yml --project-directory . up  --build --remove-orphans

#  forcibly remove volume and container for full reset
# docker compose  --env-file ./config/.env  -f ./Dockerfiles/docker-compose.storage.yml --project-directory . down --remove-orphans
# docker volume rm marie_psql_data  --force
# docker container rm marie-psql-server  --force  --volumes

# If you need to reset the PostgreSQL container and its data volume, follow these steps:

# 1. Stop and remove the container
# docker container stop marie-psql-server
# docker container rm marie-psql-server --volumes --force

# 2. Remove the named volume (now it's safe)
# docker volume rm marie_psql_data
