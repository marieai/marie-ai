# LiteLLM Proxy Configuration
#
# This configuration supports both real and mock LLM endpoints.
# Use model aliases to route requests appropriately:
#   - gpt-5.2-mock              -> AIMock server (free, for testing)
#   - gpt-5.2                   -> Real OpenAI (requires OPENAI_API_KEY)
#   - claude-sonnet-4-mock      -> AIMock server (free, for testing)
#   - claude-sonnet-4           -> Real Anthropic (requires ANTHROPIC_API_KEY)
#
# Environment variables:
#   - OPENAI_API_KEY      - OpenAI API key
#   - ANTHROPIC_API_KEY   - Anthropic API key
#   - GOOGLE_API_KEY      - Google Gemini API key
#   - AIMOCK_URL          - AIMock server URL
#                            Host-network default: http://127.0.0.1:4010
#                            Bridge-network example: http://aimock-programmatic:4010
#
# Start AIMock: docker compose -f docker-compose.mock-llm.yml up -d

model_list:
  # ==========================================================================
  # Mock Models - For testing and development (no API costs)
  # Uses AIMock server: https://github.com/CopilotKit/aimock
  # ==========================================================================

  - model_name: gpt-5.2-mock
    litellm_params:
      model: openai/gpt-5.2
      api_base: ${AIMOCK_URL:-http://127.0.0.1:4010}/v1
      api_key: mock-key
    model_info:
      description: "Mock GPT-5.2 via AIMock - no API costs"

  - model_name: gpt-5-mini-mock
    litellm_params:
      model: openai/gpt-5-mini
      api_base: ${AIMOCK_URL:-http://127.0.0.1:4010}/v1
      api_key: mock-key
    model_info:
      description: "Mock GPT-5 mini via AIMock - no API costs"

  - model_name: claude-sonnet-4-mock
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_base: ${AIMOCK_URL:-http://127.0.0.1:4010}/anthropic
      api_key: mock-key
    model_info:
      description: "Mock Claude Sonnet 4 via AIMock - no API costs"

  - model_name: gemini-2.5-flash-mock
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_base: ${AIMOCK_URL:-http://127.0.0.1:4010}/gemini
      api_key: mock-key
    model_info:
      description: "Mock Gemini 2.5 Flash via AIMock - no API costs"

  # ==========================================================================
  # Real Models - Require API keys
  # ==========================================================================

  - model_name: gpt-5.2
    litellm_params:
      model: openai/gpt-5.2
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "OpenAI GPT-5.2"

  - model_name: gpt-5-mini
    litellm_params:
      model: openai/gpt-5-mini
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "OpenAI GPT-5 mini"

  - model_name: gpt-5-nano
    litellm_params:
      model: openai/gpt-5-nano
      api_key: os.environ/OPENAI_API_KEY
    model_info:
      description: "OpenAI GPT-5 nano"

  - model_name: claude-sonnet-4
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Anthropic Claude Sonnet 4"

  - model_name: claude-haiku-3.5
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/ANTHROPIC_API_KEY
    model_info:
      description: "Anthropic Claude Haiku 3.5"

  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GOOGLE_API_KEY
    model_info:
      description: "Google Gemini 2.5 Flash"

# General settings
litellm_settings:
  # Enable request/response logging
  set_verbose: false

  # Default timeout in seconds
  request_timeout: 120

  # Retry configuration
  num_retries: 2

  # Enable caching (optional)
  cache: false

# Router settings for load balancing and fallbacks
router_settings:
  # Routing strategy: simple-shuffle, least-busy, usage-based-routing, latency-based-routing
  routing_strategy: simple-shuffle

  # Enable fallbacks between models
  enable_fallbacks: true

  # Fallback configuration
  fallbacks:
    - gpt-5.2: [gpt-5-mini, gpt-5.2-mock]
    - claude-sonnet-4: [claude-haiku-3.5, claude-sonnet-4-mock]

# Health check endpoint
health_check_settings:
  enable: true
  endpoint: /health
