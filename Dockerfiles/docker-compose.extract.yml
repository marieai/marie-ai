# ############### Marie-AI Extract Executors ###############

# GPU-enabled inference servers for document extraction

services:
  marie-extract-executor:
    image: marieai/marie:${EXTRACT_IMAGE_TAG:-5.0.0-cuda}
    restart: unless-stopped
    container_name: 'marieai-${EXTRACT_STACK_NAME:-dev}-server'
    init: true
    tty: true
    network_mode: host
#    networks:
#      - marie_default
    command: >
      server --start 
      --uses /etc/marie/config/service/extract/${EXTRACT_CONFIG_TAG:-marie-extract-4.0.0.yml}

    environment:
      - MARIE_CACHE_SKIP_LOAD=true
      - MARIE_DEFAULT_MOUNT=/etc/marie
      - MARIE_LOG_CONFIG=docker
      - MARIE_DEPLOYMENT_NAME=marie
      - COLUMNS=180
      - JINA_MP_START_METHOD=spawn
      - JINA_LOG_LEVEL=${EXTRACT_LOG_LEVEL:-DEBUG}
      - LLM_QUEUE_ENABLED=${LLM_QUEUE_ENABLED:-false}
      - LLM_QUEUE_VALKEY_URL=${LLM_QUEUE_VALKEY_URL:-redis://localhost:6379/0}
      - LLM_QUEUE_POOL_ID=${LLM_QUEUE_POOL_ID:-default}
      - LLM_QUEUE_PRODUCER_ID=${LLM_QUEUE_PRODUCER_ID:-}
      - LLM_QUEUE_PRODUCER_TTL_SECONDS=${LLM_QUEUE_PRODUCER_TTL_SECONDS:-30}
      - LLM_QUEUE_PRODUCER_REFRESH_INTERVAL_SECONDS=${LLM_QUEUE_PRODUCER_REFRESH_INTERVAL_SECONDS:-10}
      - LLM_QUEUE_REPLY_QUEUE_TTL_SECONDS=${LLM_QUEUE_REPLY_QUEUE_TTL_SECONDS:-300}
      - LLM_QUEUE_REPLY_POP_TIMEOUT_SECONDS=${LLM_QUEUE_REPLY_POP_TIMEOUT_SECONDS:-1.0}
      - LLM_QUEUE_DISPATCH_POP_TIMEOUT_SECONDS=${LLM_QUEUE_DISPATCH_POP_TIMEOUT_SECONDS:-1.0}
      - LLM_QUEUE_MAX_BATCH_ITEMS=${LLM_QUEUE_MAX_BATCH_ITEMS:-8}
      - LLM_QUEUE_MAX_BATCH_WAIT_MS=${LLM_QUEUE_MAX_BATCH_WAIT_MS:-100}
      - LLM_QUEUE_MAX_BUFFERED_REQUESTS_PER_POOL=${LLM_QUEUE_MAX_BUFFERED_REQUESTS_PER_POOL:-32}
      - LLM_QUEUE_MAX_INLINE_PAYLOAD_BYTES=${LLM_QUEUE_MAX_INLINE_PAYLOAD_BYTES:-16777216}

    volumes:
      - /mnt/data/marie-ai/config:/etc/marie/config:ro
      - /mnt/data/marie-ai/model_zoo:/etc/marie/model_zoo:rw
      - /mnt/data/marie-ai/model_zoo/cache/huggingface/hub:/root/.cache/huggingface/hub:rw
      - /mnt/data/marie-ai/config/service/im-policy.xml:/etc/ImageMagick-6/policy.xml:ro

    # Fixed GPU configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
                - compute
                - utility
        limits:
          memory: 32G

    logging:
      driver: local
      options:
        max-size: "100m"
        max-file: "10"

#    healthcheck:
#      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8080/status', timeout=5)"]
#      interval: 60s
#      timeout: 30s
#      retries: 3
#      start_period: 300s

    labels:
      - "marie.service=extract-executor"
      - "marie.version=${EXTRACT_IMAGE_TAG:-5.0.0-cuda}"

networks:
  marie_default:
    external: true
