# Sandbox secret references — git audit record.
#
# No secret values appear here or anywhere else in this repository.
# Secret material lives in the external secret store (Vault / cloud KMS).
#
# HOW SECRETS REACH THE CLUSTER
# ──────────────────────────────
# ExternalSecret CRDs are rendered by the umbrella chart template
# (templates/sandbox-secrets.yaml) from sandbox.secrets.* values in
# values.yaml.  Argo CD applies them alongside the rest of the chart resources.
# This file is NOT applied to the cluster by Argo CD — it is git metadata.
#
# HOW THE SANDBOX SERVICE USES THIS FILE
# ───────────────────────────────────────
# The Studio Sandbox Service writes this file at sandbox.create time (alongside
# values.yaml and sandbox.yaml) to record:
#   • which ClusterSecretStore was used
#   • which remote-store paths were provisioned for this sandbox
# On sandbox.delete the Service reads this file to know which remote paths to
# rotate/archive in the secret store before removing the sandbox directory.
#
# CHOICE OF SECRET MECHANISM
# ───────────────────────────
# Slice 6 implements External Secrets Operator (ESO) with external-secrets.io/v1.
# Alternatives are documented in analysis/sandbox/02-control-plane.md §Secrets:
#   Sealed Secrets — encrypted SealedSecret objects committed to git.
#   SOPS + Argo plugin — encrypted values decrypted at sync time.
#
apiVersion: marie.ai/v1alpha1
kind: SandboxSecretRef
metadata:
  # Matches the sandbox namespace / Application name.
  name: sbx-12345678-1234-1234-1234-123456789abc-a1b2c3
  namespace: sbx-12345678-1234-1234-1234-123456789abc-a1b2c3
  annotations:
    # Set by the Studio Sandbox Service at create time.
    marie.ai/eso-api-version: "external-secrets.io/v1"
    marie.ai/secret-mechanism: "ExternalSecretsOperator"
spec:
  # The ClusterSecretStore used for all ExternalSecrets in this sandbox.
  # Matches sandbox.secrets.storeRef.name in values.yaml.
  storeRef:
    name: marie-sandbox-secrets
    kind: ClusterSecretStore

  # One entry per ExternalSecret the chart renders.
  # Each entry maps:
  #   secretName  — Kubernetes Secret produced in this sandbox namespace
  #   remoteKey   — path in the external store (matches values.yaml)
  #   purpose     — corresponds to the sandbox.secrets.secrets.<purpose> key
  refs:
    - secretName: sbx-12345678-1234-1234-1234-123456789abc-a1b2c3-marie-sandbox-admin
      remoteKey: sandboxes/sbx-12345678-1234-1234-1234-123456789abc-a1b2c3/admin
      purpose: adminApiKey
      # This Secret is read by the Wave-1 seed-defaults Job (key: api_key).
      # The Studio Sandbox Service also reads it for the sandbox launch token.

    - secretName: sbx-12345678-1234-1234-1234-123456789abc-a1b2c3-marie-sandbox-db
      remoteKey: sandboxes/sbx-12345678-1234-1234-1234-123456789abc-a1b2c3/db
      purpose: dbPassword
      # Consumed by the bundled PostgreSQL subchart via postgresql.auth.existingSecret.

    - secretName: sbx-12345678-1234-1234-1234-123456789abc-a1b2c3-marie-sandbox-storage
      remoteKey: sandboxes/sbx-12345678-1234-1234-1234-123456789abc-a1b2c3/storage
      purpose: storageCredentials
      # Consumed by the MinIO subchart via minio.auth.existingSecret.

    - secretName: sbx-12345678-1234-1234-1234-123456789abc-a1b2c3-marie-sandbox-runner
      remoteKey: sandboxes/sbx-12345678-1234-1234-1234-123456789abc-a1b2c3/runner
      purpose: runnerSecret
      # Referenced in executor pool env (RUNNER_REGISTRATION_TOKEN).
