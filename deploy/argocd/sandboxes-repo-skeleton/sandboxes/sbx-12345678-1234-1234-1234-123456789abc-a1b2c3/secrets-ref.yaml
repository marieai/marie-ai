# Sandbox secret references — git stores ONLY names and remote-store pointers.
# No secret values appear in this file or anywhere else in this repository.
# Secret material is provisioned by External Secrets Operator (Slice 6).
#
# PLACEHOLDER — Slice 6 (OD4) decides the concrete secret delivery mechanism:
#   ExternalSecretReferenceList is a Marie-internal marker kind.  When Slice 6
#   lands it will be replaced by real ESO ExternalSecret objects (if using ESO)
#   or SealedSecret objects (if using Sealed Secrets).  These are NOT applied to
#   the cluster by Argo CD — the ApplicationSet uses only values.yaml from this
#   directory as a Helm values source; sandbox.yaml, secrets-ref.yaml, and snapshot
#   files are git metadata read directly by the Sandbox Service.
#
# The Sandbox Service reads this file at sandbox creation time to know which
# secret-store keys to provision via the chosen mechanism.
#
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecretReferenceList
metadata:
  namespace: sbx-12345678-1234-1234-1234-123456789abc-a1b2c3
refs:
  # Per-sandbox dedicated PostgreSQL credentials.
  - name: sbx-12345678-1234-1234-1234-123456789abc-a1b2c3-db
    remoteKey: sandboxes/sbx-12345678-1234-1234-1234-123456789abc-a1b2c3/db

  # Per-sandbox MinIO object-storage credentials.
  - name: sbx-12345678-1234-1234-1234-123456789abc-a1b2c3-storage
    remoteKey: sandboxes/sbx-12345678-1234-1234-1234-123456789abc-a1b2c3/storage

  # Per-sandbox runner registration secret.
  - name: sbx-12345678-1234-1234-1234-123456789abc-a1b2c3-runner
    remoteKey: sandboxes/sbx-12345678-1234-1234-1234-123456789abc-a1b2c3/runner
