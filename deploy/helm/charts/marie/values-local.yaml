# Marie-AI Helm Chart - Local Development Values
# Usage: helm install marie . -f values-local.yaml -n marie --create-namespace
#
# This configuration matches the local Docker environment:
# - PostgreSQL: ghcr.io/ferretdb/postgres-documentdb:17-0.103.0
# - MinIO: minio/minio:latest
# - RabbitMQ: rabbitmq:3-management-alpine
# - Valkey: valkey/valkey:9-alpine

global:
  marie:
    image:
      repository: marieai/marie
      tag: "5.0.1-cuda"
    logging:
      level: INFO
    debugQueryPlanner: "FALSE"
  grpc:
    trace: ALL
    verbosity: DEBUG
  openai:
    apiBase: http://192.222.48.192
    apiKey: EMPTY
  schedulerTrace:
    enabled: true
    path: /tmp/marie-scheduler-trace.jsonl
  valkey:
    enabled: true
    auth:
      enabled: true
  llmQueue:
    enabled: true
    poolId: default
    fabricGroupId: default
    gatewayId: default
  postgresql:
    enabled: true
    auth:
      username: postgres
      database: postgres
  rabbitmq:
    enabled: true
    auth:
      username: marie
  etcd:
    enabled: true
  minio:
    enabled: true
    port: 8000
    defaultBuckets: "marie"
  storage:
    type: minio

# Marie-AI core settings
marie:
  image:
    repository: marieai/marie
    tag: "5.0.1-cuda"
    pullPolicy: IfNotPresent

  logging:
    level: INFO
    format: json

  # Use Kubernetes for service discovery in local dev
  discovery:
    mechanism: kubernetes

# Server configuration
server:
  enabled: true
  replicas: 1

  image:
    repository: marieai/marie-gateway
    tag: "5.0.1-cpu"

  config:
    configFile: /etc/marie/config/service/marie-gateway-4.0.0.yml
    extraSearchPaths: /etc/marie/config/extra_py_modules
    psqlDir: /marie/config/psql
    schemaDir: /marie/config/psql/schema
    metrics:
      enabled: true
      exporterHost: localhost
      exporterPort: 4317
    tracing:
      enabled: true
      exporterHost: localhost
      exporterPort: 4317

  service:
    type: NodePort
    port: 52000
    httpPort: 51000
    nodePorts:
      grpc: 30052
      http: 30080

  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# Executor configuration - minimal for local dev
executor:
  enabled: true
  pools:
    # Single CPU executor for local testing
    - name: cpu-local
      enabled: true
      replicas: 1
      gpu: false
      stateful: false
      strategy:
        type: Recreate

      resources:
        requests:
          cpu: "500m"
          memory: "1Gi"
        limits:
          cpu: "2"
          memory: "4Gi"

    # GPU executor - disabled by default for local
    - name: gpu-ocr
      enabled: false

# PostgreSQL - using FerretDB DocumentDB image
postgresql:
  enabled: true

  image:
    registry: ghcr.io
    repository: ferretdb/postgres-documentdb
    tag: "17-0.103.0"

  auth:
    postgresPassword: "marie-password"
    username: postgres
    password: "marie-password"
    database: postgres

  primary:
    persistence:
      enabled: true
      size: 5Gi

# MinIO - S3-compatible storage
minio:
  enabled: true

  image:
    registry: docker.io
    repository: minio/minio
    tag: latest

  mode: standalone

  auth:
    rootUser: minioadmin
    rootPassword: "minioadmin123"

  defaultBuckets: "marie"

  persistence:
    enabled: true
    size: 5Gi

  service:
    type: NodePort
    port: 8000
    consolePort: 9001

# RabbitMQ - message queue
rabbitmq:
  enabled: true

  image:
    registry: docker.io
    repository: rabbitmq
    tag: "3-management-alpine"

  auth:
    username: marie
    password: "marie-mq-password"

  persistence:
    enabled: true
    size: 2Gi

# Valkey - queued LLM request/reply store
valkey:
  enabled: true

  image:
    repository: valkey/valkey
    tag: "9-alpine"

  auth:
    enabled: true
    password: "marie-valkey-password"

  persistence:
    enabled: true
    size: 2Gi

# etcd - service discovery, matching bootstrap
etcd:
  enabled: true

# ClickHouse - analytics database (used by marie-ai)
clickhouse:
  enabled: true

  image:
    repository: clickhouse/clickhouse-server
    tag: "latest"

  service:
    type: NodePort
    httpPort: 8123
    nativePort: 9000

  config:
    defaultDatabase: marie
    defaultUser: default
    defaultPassword: ""
    logLevel: information

  resources:
    requests:
      cpu: "500m"
      memory: "2Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

  persistence:
    enabled: true
    size: 10Gi
    logs:
      enabled: false

# Gitea - Git service (used by marie-studio)
gitea:
  enabled: true

  image:
    repository: gitea/gitea
    tag: "latest"

  service:
    type: NodePort
    httpPort: 3000
    sshPort: 2222

  config:
    appName: "Marie Studio Git"
    runMode: dev
    domain: localhost
    rootURL: "http://localhost:3000"
    sshDomain: localhost
    sshPort: 2222
    installLock: false
    disableRegistration: false
    logLevel: info

  # Uses shared PostgreSQL
  database:
    type: postgres
    name: gitea
    sslMode: disable

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  persistence:
    enabled: true
    size: 5Gi

# Storage configuration
storage:
  type: minio

# Observability - minimal for local
observability:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: false

  grafana:
    dashboards:
      enabled: false

  jaeger:
    enabled: false

  otel:
    enabled: false

# Security - relaxed for local development
security:
  podSecurityContext:
    runAsNonRoot: false

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false

  networkPolicy:
    enabled: false

  tls:
    enabled: false
