# Marie-AI Helm Chart — Sandbox Values Overlay
#
# This overlay renders a full Marie system into an isolated sandbox namespace.
# Apply on top of values.yaml (and optionally values-local.yaml or values-production.yaml):
#
#   helm install sbx-<id> . \
#     -f values.yaml \
#     -f values-sandbox.yaml \
#     -n sbx-<id> --create-namespace \
#     --set sandbox.host=<id>.sbx.example.com \
#     --set sandbox.size=small
#
# Sizing tiers (sandbox.size):
#   small   — demos / ephemeral previews
#   medium  — short-lived team sandboxes
#   large   — load-test / full-featured evaluation
#
# Each tier maps to the ResourceQuota + LimitRange values in the
# sandbox-governance.yaml template.

# ----------------------------------------------------------------
# Sandbox identity — required overrides per sandbox instance
# ----------------------------------------------------------------
sandbox:
  # Gate: renders governance objects (ResourceQuota, LimitRange,
  # NetworkPolicy, Namespace labels) and activates sandbox-specific
  # sizing and ingress defaults.
  enabled: true

  # Per-sandbox ingress hostname. Each sandbox gets its own subdomain.
  # Example: a1b2.sbx.example.com
  # Override at install time: --set sandbox.host=<id>.sbx.example.com
  host: ""

  # Sizing tier: small | medium | large
  # Drives ResourceQuota + LimitRange values applied to the namespace.
  size: small

  # Egress allowlist — CIDRs or service-name annotations reachable from
  # sandbox pods beyond intra-namespace and ingress-controller traffic.
  # Add plugin marketplace and LLM gateway endpoints here.
  egress:
    # DNS (kube-dns / CoreDNS) — always needed; matches kube-system 53/UDP+TCP
    dns:
      enabled: true
      # CoreDNS CIDR — override to match your cluster's kube-dns Service IP.
      # Use: kubectl get svc -n kube-system kube-dns -o jsonpath='{.spec.clusterIP}'
      clusterDnsCidr: '10.96.0.0/12'

    # External plugin marketplace / registry reachable from sandbox executors.
    # Set to the cluster-internal Service IP or an external CIDR range.
    pluginRegistry:
      enabled: false
      cidr: ''
      port: 443

    # External LLM gateway (if not served cluster-internally).
    llmGateway:
      enabled: false
      cidr: ''
      port: 443

  # ---- Seed configuration — Wave-1 defaults + Studio-orchestrated metadata --
  #
  # Wave-1 (seed-defaults Job) always runs when sandbox.enabled=true.
  # Blueprint + plugin seeding (Waves 2–3) is Studio-orchestrated: after Argo
  # reports the sandbox Synced and this Job is done, the Studio Sandbox Service
  # calls the sandbox gateway using Studio's existing blueprint-import.service
  # with the values below.  There are NO in-namespace blueprint/plugin Jobs.
  seed:
    # Name of the k8s Secret holding the sandbox admin API key.
    # Must be pre-created before install (Slice 6 automates via ESO/Sealed/SOPS).
    # Defaults to <release-fullname>-sandbox-admin when empty.
    adminApiKeySecret: ''
    adminApiKeySecretKey: 'api_key'

    # ---- Informational metadata consumed by the Studio Sandbox Service -----
    # These values are NOT used by any in-namespace Kubernetes Job.
    # The Studio Sandbox Service reads them from the Argo Application values
    # after the sandbox is Synced to decide what blueprint/plugins to install.

    # Blueprint identifier to install after defaults.
    # Empty = no blueprint seeding.
    # Example: "ner-vlm-ocr-entity-extraction"
    blueprintId: ''

    # Plugin refs from the blueprint's extension_package.
    # Read by the Studio Sandbox Service after blueprint import completes.
    # Each entry must have at minimum: { packageId: "...", version: "..." }
    # Example:
    #   pluginRefs:
    #     - packageId: "connector.ocr-engine"
    #       version: "2.1.0"
    #     - packageId: "connector.ner-model"
    #       version: "1.4.2"
    pluginRefs: []

  # ---- Secret delivery via External Secrets Operator (Slice 6) -----------
  #
  # ESO API: external-secrets.io/v1  (requires ESO v0.10+ on the cluster)
  # Alternatives (documented, not implemented): Sealed Secrets, SOPS + Argo plugin.
  #
  # The chart template (sandbox-secrets.yaml) renders one ExternalSecret CRD per
  # configured entry when both sandbox.enabled=true and sandbox.secrets.enabled=true.
  # Argo CD applies these alongside the rest of the chart resources.
  #
  # STUDIO RENDERER CONTRACT — values that sandbox-renderer.ts MUST emit in
  # sandboxes/<ns>/values.yaml for each sandbox:
  #
  #   sandbox.secrets.storeRef.name         — ClusterSecretStore name provisioned
  #                                            by the platform operator.
  #   sandbox.secrets.storeRef.kind         — ClusterSecretStore (default) or SecretStore.
  #   sandbox.secrets.secrets.adminApiKey.remoteKey
  #       Path in the remote store for this sandbox's admin API key.
  #       Convention: "sandboxes/<namespace>/admin"
  #   sandbox.secrets.secrets.dbPassword.remoteKey
  #       Path for the dedicated PostgreSQL password.
  #       Convention: "sandboxes/<namespace>/db"
  #   sandbox.secrets.secrets.storageCredentials.remoteKey
  #       Path for MinIO access-key + secret-key (stored as a JSON map).
  #       Convention: "sandboxes/<namespace>/storage"
  #   sandbox.secrets.secrets.runnerSecret.remoteKey
  #       Path for the runner registration token.
  #       Convention: "sandboxes/<namespace>/runner"
  #
  # Values the renderer MUST NOT set (chart supplies defaults):
  #   secretName  — defaults to <fullname>-sandbox-{admin|db|storage|runner}
  #   property    — defaults to api_key / password / access-key,secret-key / token
  #   refreshInterval — defaults to "1h"
  secrets:
    enabled: true

    storeRef:
      # STUDIO RENDERER MUST POPULATE.  The ClusterSecretStore named here must be
      # pre-provisioned on the cluster before sandboxes are created.
      name: "marie-sandbox-secrets"
      kind: ClusterSecretStore

    refreshInterval: "1h"

    secrets:
      adminApiKey:
        # Produced Secret name MUST match sandbox.seed.adminApiKeySecret default
        # (<fullname>-sandbox-admin) so the Wave-1 seed-defaults Job finds it.
        # Override only when also overriding sandbox.seed.adminApiKeySecret.
        secretName: ""
        # STUDIO RENDERER MUST SET per sandbox.
        # Example: "sandboxes/sbx-<orgId>-<shortId>/admin"
        remoteKey: ""
        property: api_key

      dbPassword:
        # Subchart seam: the Studio renderer must also add to values.yaml:
        #   postgresql.auth.existingSecret: <secretName>   (default: <fullname>-sandbox-db)
        #   postgresql.auth.secretKeys.userPasswordKey: password
        secretName: ""
        # STUDIO RENDERER MUST SET per sandbox.
        # Example: "sandboxes/sbx-<orgId>-<shortId>/db"
        remoteKey: ""
        property: password

      storageCredentials:
        # Subchart seam: the Studio renderer must also add to values.yaml:
        #   minio.auth.existingSecret: <secretName>   (default: <fullname>-sandbox-storage)
        # The remote secret must expose fields "access-key" and "secret-key".
        secretName: ""
        # STUDIO RENDERER MUST SET per sandbox.
        # Example: "sandboxes/sbx-<orgId>-<shortId>/storage"
        remoteKey: ""
        accessKeyProperty: access-key
        secretKeyProperty: secret-key

      runnerSecret:
        # Subchart seam: the Studio renderer must reference this Secret in the
        # executor pool env, e.g.:
        #   executor.pools[*].env:
        #     - name: RUNNER_REGISTRATION_TOKEN
        #       valueFrom:
        #         secretKeyRef:
        #           name: <secretName>   (default: <fullname>-sandbox-runner)
        #           key: token
        secretName: ""
        # STUDIO RENDERER MUST SET per sandbox.
        # Example: "sandboxes/sbx-<orgId>-<shortId>/runner"
        remoteKey: ""
        property: token

# ----------------------------------------------------------------
# Sizing presets — values overridden by sandbox-governance template
# based on sandbox.size.  Not referenced directly by sub-charts;
# the governance template reads these to build ResourceQuota +
# LimitRange objects.
# ----------------------------------------------------------------
sandboxSizes:
  small:
    quota:
      cpu: '8'
      memory: 16Gi
      pods: '20'
      pvcs: '8'
      storage: 100Gi
    limits:
      defaultCpu: '500m'
      defaultMemory: 512Mi
      defaultRequestCpu: '100m'
      defaultRequestMemory: 128Mi
      maxCpu: '4'
      maxMemory: 8Gi

  medium:
    quota:
      cpu: '24'
      memory: 48Gi
      pods: '40'
      pvcs: '12'
      storage: 300Gi
    limits:
      defaultCpu: '1'
      defaultMemory: 1Gi
      defaultRequestCpu: '200m'
      defaultRequestMemory: 256Mi
      maxCpu: '8'
      maxMemory: 16Gi

  large:
    quota:
      cpu: '64'
      memory: 128Gi
      pods: '80'
      pvcs: '20'
      storage: 1Ti
    limits:
      defaultCpu: '2'
      defaultMemory: 2Gi
      defaultRequestCpu: '500m'
      defaultRequestMemory: 512Mi
      maxCpu: '16'
      maxMemory: 32Gi

# ----------------------------------------------------------------
# Server — sandbox-sized ingress override
# ----------------------------------------------------------------
server:
  enabled: true
  replicas: 1

  resources:
    requests:
      cpu: '500m'
      memory: 1Gi
    limits:
      cpu: '2'
      memory: 4Gi

  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-body-size: 128m
    hosts:
      - host: ''   # populated at install time via --set sandbox.host=...
        paths:
          - path: /
            pathType: Prefix
    tls: []

# ----------------------------------------------------------------
# Executor — single small CPU pool; GPU disabled for sandboxes by default
# ----------------------------------------------------------------
executor:
  enabled: true
  pools:
    - name: cpu-sandbox
      enabled: true
      replicas: 1
      gpu: false
      resources:
        requests:
          cpu: '500m'
          memory: 1Gi
        limits:
          cpu: '2'
          memory: 4Gi
      env: []

    - name: gpu-ocr
      enabled: false

# ----------------------------------------------------------------
# Stateful deps — small persistence for sandboxes
# ----------------------------------------------------------------
postgresql:
  primary:
    persistence:
      size: 5Gi

minio:
  persistence:
    size: 5Gi

rabbitmq:
  persistence:
    size: 2Gi

valkey:
  persistence:
    size: 1Gi

etcd:
  persistence:
    size: 1Gi
  quotaBackendBytes: "536870912"

clickhouse:
  enabled: false

gitea:
  enabled: false

# ----------------------------------------------------------------
# Observability — minimal for sandboxes
# ----------------------------------------------------------------
observability:
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: false
  grafana:
    dashboards:
      enabled: false
  jaeger:
    enabled: false
  otel:
    enabled: false
