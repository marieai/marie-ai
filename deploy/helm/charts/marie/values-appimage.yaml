# Dependency topology for the M3 Forge AppImage bootstrap profile.
# Apply the AMD64 digest overlay after this file. Instance
# credentials, storage sizes, and application values are generated by m3ctl.

global:
  lifecycle:
    managed: true
    phase: infrastructure
  storageClass: local-path
  marie:
    image:
      repository: docker.io/marieai/marie
      tag: "5.0.2-cuda"

server:
  enabled: true
  replicas: 1
  progressDeadlineSeconds: 1800
  image:
    repository: docker.io/marieai/marie-gateway
    tag: "5.0.2-cpu"
    pullPolicy: IfNotPresent
  llmTracking:
    enabled: false
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

executor:
  enabled: true
  llmTracking:
    enabled: false
  gpuMonitor:
    enabled: false
  pools:
    - name: default-local
      enabled: true
      replicas: 1
      progressDeadlineSeconds: 1800
      gpu: false
      stateful: false
      strategy:
        type: Recreate
      image:
        repository: docker.io/marieai/marie
        tag: "5.0.2-cuda"
        pullPolicy: IfNotPresent
      resources:
        requests:
          cpu: "500m"
          memory: "2Gi"
        limits:
          cpu: "4"
          memory: "8Gi"

postgresql:
  enabled: true
  image:
    registry: ghcr.io
    repository: ferretdb/postgres-documentdb
    tag: "17-0.103.0"
    pullPolicy: IfNotPresent
  primary:
    persistence:
      storageClass: local-path
  databaseInit:
    enabled: true
    databases:
      - m3forge

rabbitmq:
  enabled: true
  image:
    registry: docker.io
    repository: library/rabbitmq
    tag: "3-management-alpine"
    pullPolicy: IfNotPresent
  persistence:
    storageClass: local-path

valkey:
  enabled: true
  image:
    repository: docker.io/valkey/valkey
    tag: "9-alpine"
    pullPolicy: IfNotPresent
  persistence:
    storageClass: local-path

etcd:
  enabled: true
  image:
    registry: quay.io
    repository: coreos/etcd
    tag: "v3.7.0"
    pullPolicy: IfNotPresent
  persistence:
    storageClass: local-path

minio:
  enabled: true
  progressDeadlineSeconds: 1800
  image:
    registry: docker.io
    repository: minio/minio
    tag: latest
    pullPolicy: IfNotPresent
  provisioning:
    enabled: true
    image:
      registry: docker.io
      repository: minio/mc
      tag: latest
      pullPolicy: IfNotPresent
  persistence:
    storageClass: local-path

clickhouse:
  enabled: true
  image:
    repository: docker.io/clickhouse/clickhouse-server
    tag: latest
    pullPolicy: IfNotPresent
  persistence:
    storageClass: local-path

gitea:
  enabled: true
  progressDeadlineSeconds: 1800
  image:
    repository: docker.io/gitea/gitea
    tag: "1.25.4"
    pullPolicy: IfNotPresent
  # The standard image initializes /data as root before dropping to USER_UID.
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    runAsNonRoot: false
  config:
    installLock: true
  persistence:
    storageClass: local-path
