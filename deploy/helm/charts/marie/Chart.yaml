apiVersion: v2
name: marie
description: Marie-AI - Agentic Document Intelligence Platform

type: application
version: 0.1.0
appVersion: "5.0.4"

keywords:
  - document-processing
  - ocr
  - ai
  - machine-learning
  - nlp

home: https://marieai.co
sources:
  - https://github.com/marieai/marie-ai

maintainers:
  - name: Marie-AI Team
    email: support@marieai.co

dependencies:
  # Marie-AI Server (combined gateway + scheduler)
  - name: server
    version: "0.1.0"
    repository: "file://charts/server"
    condition: server.enabled

  # Executor workers
  - name: executor
    version: "0.1.0"
    repository: "file://charts/executor"
    condition: executor.enabled

  # Optional: PostgreSQL/DocumentDB matching docker-compose/bootstrap image
  - name: postgresql
    version: "0.1.0"
    repository: "file://charts/postgresql"
    condition: postgresql.enabled

  # Optional: RabbitMQ matching docker-compose/bootstrap image
  - name: rabbitmq
    version: "0.1.0"
    repository: "file://charts/rabbitmq"
    condition: rabbitmq.enabled

  # Optional: etcd matching docker-compose/bootstrap image
  - name: etcd
    version: "0.1.0"
    repository: "file://charts/etcd"
    condition: etcd.enabled

  # Optional: Valkey queue/cache store
  - name: valkey
    version: "0.1.0"
    repository: "file://charts/valkey"
    condition: valkey.enabled

  # Optional: MinIO matching docker-compose/bootstrap image
  - name: minio
    version: "0.1.0"
    repository: "file://charts/minio"
    condition: minio.enabled

  # Optional: ClickHouse (analytics database for marie-ai)
  - name: clickhouse
    version: "0.1.0"
    repository: "file://charts/clickhouse"
    condition: clickhouse.enabled

  # Optional: Gitea (Git service for marie-studio)
  - name: gitea
    version: "0.1.0"
    repository: "file://charts/gitea"
    condition: gitea.enabled
