{{/*
Sandbox per-sandbox secret delivery via External Secrets Operator (ESO).

ESO API version: external-secrets.io/v1 (requires ESO v0.10+, the current stable
as of this slice).  v1beta1 is supported by older ESO releases; v1 is recommended
for all new installs.  Alternatives (not implemented): Sealed Secrets, SOPS + Argo
plugin — see analysis/sandbox/02-control-plane.md §Secrets.

Rendered when BOTH conditions are true:
  sandbox.enabled = true
  sandbox.secrets.enabled = true

One ExternalSecret resource is rendered per configured entry in
sandbox.secrets.secrets, gated on the entry having a non-empty remoteKey.
If remoteKey is empty the entry is silently skipped so that callers can
include the block in values-sandbox.yaml without requiring every secret to be
provisioned at once.

Admin API key contract (must be preserved):
  ExternalSecret spec.target.name = <fullname>-sandbox-admin  (or secretName override)
  data[0].secretKey              = api_key                    (or property override)
This matches the Secret name and key that the Wave-1 seed-defaults Job reads
(sandbox-seed-defaults.yaml: $adminSecret / $adminKey).

Subchart seam notes (documented here; wiring goes in the sandbox values.yaml
written by the Studio Sandbox Service renderer):
  dbPassword         → postgresql.auth.existingSecret = <fullname>-sandbox-db
  storageCredentials → minio.auth.existingSecret      = <fullname>-sandbox-storage
  runnerSecret       → executor.pools[*].env referencing <fullname>-sandbox-runner
*/}}
{{- if and .Values.sandbox.enabled .Values.sandbox.secrets.enabled }}

{{- $fullname := include "marie.fullname" . }}
{{- $secCfg   := .Values.sandbox.secrets }}
{{- $storeRef  := $secCfg.storeRef }}
{{- $refresh   := $secCfg.refreshInterval | default "1h" }}
{{- $secs      := $secCfg.secrets }}

{{/* ----------------------------------------------------------------
  Admin API key
  Target Secret: <fullname>-sandbox-admin  key: api_key
  This MUST match what sandbox-seed-defaults.yaml reads:
    $adminSecret = sandbox.seed.adminApiKeySecret default <fullname>-sandbox-admin
    $adminKey    = sandbox.seed.adminApiKeySecretKey default api_key
---------------------------------------------------------------- */}}
{{- $adminCfg        := $secs.adminApiKey }}
{{- $adminSecretName := $adminCfg.secretName | default (printf "%s-sandbox-admin" $fullname) }}
{{- $adminProperty   := $adminCfg.property | default "api_key" }}
{{- if $adminCfg.remoteKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-eso-admin-apikey
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-secrets
    marie.ai/secret-purpose: admin-apikey
spec:
  refreshInterval: {{ $refresh | quote }}
  secretStoreRef:
    name: {{ $storeRef.name | quote }}
    kind: {{ $storeRef.kind }}
  target:
    name: {{ $adminSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $adminProperty }}
      remoteRef:
        key: {{ $adminCfg.remoteKey | quote }}
        property: {{ $adminProperty | quote }}
{{- end }}

{{/* ----------------------------------------------------------------
  Database password
  Target Secret: <fullname>-sandbox-db  key: password
  Subchart seam: set in sandbox values.yaml (Sandbox Service renderer):
    postgresql.auth.existingSecret: <secretName>
    postgresql.auth.secretKeys.userPasswordKey: password
---------------------------------------------------------------- */}}
{{- $dbCfg        := $secs.dbPassword }}
{{- $dbSecretName := $dbCfg.secretName | default (printf "%s-sandbox-db" $fullname) }}
{{- $dbProperty   := $dbCfg.property | default "password" }}
{{- if $dbCfg.remoteKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-eso-db-password
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-secrets
    marie.ai/secret-purpose: db-password
  annotations:
    marie.ai/subchart-seam: postgresql.auth.existingSecret
spec:
  refreshInterval: {{ $refresh | quote }}
  secretStoreRef:
    name: {{ $storeRef.name | quote }}
    kind: {{ $storeRef.kind }}
  target:
    name: {{ $dbSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $dbProperty }}
      remoteRef:
        key: {{ $dbCfg.remoteKey | quote }}
        property: {{ $dbProperty | quote }}
{{- end }}

{{/* ----------------------------------------------------------------
  Object-storage credentials (MinIO / S3-compatible)
  Target Secret: <fullname>-sandbox-storage
    keys: access-key, secret-key
  Subchart seam: set in sandbox values.yaml (Sandbox Service renderer):
    minio.auth.existingSecret: <secretName>
---------------------------------------------------------------- */}}
{{- $storageCfg        := $secs.storageCredentials }}
{{- $storageSecretName := $storageCfg.secretName | default (printf "%s-sandbox-storage" $fullname) }}
{{- $accessKeyProp     := $storageCfg.accessKeyProperty | default "access-key" }}
{{- $secretKeyProp     := $storageCfg.secretKeyProperty | default "secret-key" }}
{{- if $storageCfg.remoteKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-eso-storage-creds
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-secrets
    marie.ai/secret-purpose: storage-credentials
  annotations:
    marie.ai/subchart-seam: minio.auth.existingSecret
spec:
  refreshInterval: {{ $refresh | quote }}
  secretStoreRef:
    name: {{ $storeRef.name | quote }}
    kind: {{ $storeRef.kind }}
  target:
    name: {{ $storageSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $accessKeyProp }}
      remoteRef:
        key: {{ $storageCfg.remoteKey | quote }}
        property: {{ $accessKeyProp | quote }}
    - secretKey: {{ $secretKeyProp }}
      remoteRef:
        key: {{ $storageCfg.remoteKey | quote }}
        property: {{ $secretKeyProp | quote }}
{{- end }}

{{/* ----------------------------------------------------------------
  Runner registration secret
  Target Secret: <fullname>-sandbox-runner  key: token
  Subchart seam: reference in sandbox values.yaml (Sandbox Service renderer):
    executor.pools[*].env:
      - name: RUNNER_REGISTRATION_TOKEN
        valueFrom:
          secretKeyRef:
            name: <secretName>
            key: token
---------------------------------------------------------------- */}}
{{- $runnerCfg        := $secs.runnerSecret }}
{{- $runnerSecretName := $runnerCfg.secretName | default (printf "%s-sandbox-runner" $fullname) }}
{{- $runnerProperty   := $runnerCfg.property | default "token" }}
{{- if $runnerCfg.remoteKey }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $fullname }}-eso-runner-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-secrets
    marie.ai/secret-purpose: runner-secret
  annotations:
    marie.ai/subchart-seam: executor.pools.env.RUNNER_REGISTRATION_TOKEN
spec:
  refreshInterval: {{ $refresh | quote }}
  secretStoreRef:
    name: {{ $storeRef.name | quote }}
    kind: {{ $storeRef.kind }}
  target:
    name: {{ $runnerSecretName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ $runnerProperty }}
      remoteRef:
        key: {{ $runnerCfg.remoteKey | quote }}
        property: {{ $runnerProperty | quote }}
{{- end }}

{{- end }}{{/* sandbox.enabled && sandbox.secrets.enabled */}}
