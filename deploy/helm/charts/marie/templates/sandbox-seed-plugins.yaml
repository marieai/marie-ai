{{/*
Sandbox Wave-3 plugin / extension install Job.

Installs the blueprint's extension_package plugin refs into the sandbox
gateway's connector registry.

Implements the Wave-3 step of the seed pipeline defined in:
  analysis/sandbox/04-seeding-blueprints.md § Wave 3 — Plugin install

Ordering:
  argocd.argoproj.io/sync-wave: "3"   — after Wave-2 blueprint install Job
  helm.sh/hook-weight: "3"            — plain Helm installs without Argo

Entrypoint:  python -m marie.sandbox install-plugins
Source:      marie/sandbox/install_plugins.py

Integration seam — WHAT IS ASSUMED vs CONFIRMED:
  Confirmed gateway endpoints (marie_gateway.py):
    POST /api/connectors/deploy
  Plugin runner infrastructure (confirmed):
    marie/executor/extensions/plugin_daemon_executor.py
  Assumed / NOT YET BUILT:
    - Plugin marketplace registry serving <packageId>/<version>.plugin tarballs
    - Dedicated POST /api/plugins/install gateway endpoint
    - Credential binding for "install-time" bindings (deferred to Slice 6)

Plugin refs are passed as a JSON array via SANDBOX_PLUGIN_REFS.
Each element must have at minimum: { "packageId": "...", "version": "..." }

Rendered only when sandbox.enabled=true AND sandbox.seed.plugins.enabled=true.
*/}}
{{- if and .Values.sandbox.enabled .Values.sandbox.seed.plugins.enabled }}

{{- $fullname   := include "marie.fullname" . }}
{{- $seed       := .Values.sandbox.seed }}
{{- $plugins    := $seed.plugins }}
{{- $adminSecret := $seed.adminApiKeySecret | default (printf "%s-sandbox-admin" $fullname) }}
{{- $adminKey    := $seed.adminApiKeySecretKey | default "api_key" }}

{{- $gwService  := $seed.gatewayServiceName | default (printf "%s-server" .Release.Name) }}
{{- $gwPort     := $seed.gatewayHttpPort | default 51000 }}
{{- $gwUrl      := printf "http://%s:%v" $gwService $gwPort }}

apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $fullname }}-sandbox-seed-plugins
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "marie.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-seed-plugins
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "3"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "marie.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: sandbox-seed-plugins
    spec:
      restartPolicy: OnFailure
      {{- include "marie.imagePullSecrets" . | nindent 6 }}
      containers:
        - name: seed-plugins
          image: {{ include "marie.image" . }}
          imagePullPolicy: {{ .Values.marie.image.pullPolicy }}
          command:
            - python
            - -m
            - marie.sandbox
            - install-plugins
          env:
            # Gateway URL — in-namespace cluster DNS
            - name: SANDBOX_GATEWAY_URL
              value: {{ $gwUrl | quote }}
            # Admin API key from Wave-1
            - name: SANDBOX_ADMIN_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $adminSecret }}
                  key: {{ $adminKey }}
            # Plugin registry
            - name: SANDBOX_PLUGIN_REGISTRY_URL
              value: {{ $plugins.registryUrl | quote }}
            # Plugin refs as JSON array; rendered from values at install time
            - name: SANDBOX_PLUGIN_REFS
              value: {{ $plugins.refs | toJson | quote }}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

{{- end }}{{/* sandbox.enabled && sandbox.seed.plugins.enabled */}}
