# Marie-AI Helm Chart Values
# This is the umbrella chart configuration

# Global settings applied to all subcharts
global:
  # Container image registry
  imageRegistry: ""
  # Image pull secrets for private registries
  imagePullSecrets: []
  # Default storage class for PVCs
  storageClass: ""
  # Common labels applied to all resources
  labels: {}
  # Common annotations applied to all resources
  annotations: {}
  # Values consumed by bundled subcharts.
  serviceAccount:
    create: true
    name: ""
  marie:
    image:
      repository: marieai/marie
      tag: "4.5rc1-cuda"
    logging:
      level: INFO
    debugQueryPlanner: "FALSE"
  grpc:
    trace: ""
    verbosity: ""
  openai:
    apiBase: ""
    apiKey: ""
    existingSecret: ""
    existingSecretApiKeyKey: api-key
  schedulerTrace:
    enabled: false
    path: /tmp/marie-scheduler-trace.jsonl
  # Valkey connection exposed to Marie subcharts. `enabled` means Marie services
  # should receive Valkey connection settings; chart ownership is controlled by
  # the top-level `valkey.enabled` dependency flag.
  valkey:
    enabled: true
    host: ""
    port: 6379
    database: 0
    tls: false
    auth:
      enabled: false
      existingSecret: ""
      existingSecretPasswordKey: password
  llmQueue:
    enabled: false
    poolId: default
    fabricGroupId: default
    gatewayId: default
    producerId: ""
    producerTtlSeconds: 30
    producerRefreshIntervalSeconds: 10
    replyQueueTtlSeconds: 300
    replyPopTimeoutSeconds: "1.0"
    dispatchPopTimeoutSeconds: "1.0"
    maxBatchItems: 8
    maxBatchWaitMs: 100
    maxBufferedRequestsPerPool: 32
    maxInlinePayloadBytes: "16777216"
  postgresql:
    enabled: true
    auth:
      username: postgres
      database: postgres
    external:
      host: ""
      port: 5432
      database: marie
      username: marie
      existingSecret: ""
      existingSecretPasswordKey: password
  rabbitmq:
    enabled: true
    auth:
      username: marie
    external:
      host: ""
      port: 5672
      username: marie
      existingSecret: ""
      existingSecretPasswordKey: password
  etcd:
    enabled: true
    external:
      endpoints: []
  minio:
    enabled: true
    port: 8000
    defaultBuckets: "marie"
    external:
      endpoint: ""
      bucket: marie
      existingSecret: ""
      existingSecretAccessKeyKey: access-key
      existingSecretSecretKeyKey: secret-key
  storage:
    type: minio
    s3:
      bucket: marie
      region: us-east-1
      endpoint: ""
      existingSecret: ""
      existingSecretAccessKeyKey: access-key
      existingSecretSecretKeyKey: secret-key

# Marie-AI core settings
marie:
  image:
    repository: marieai/marie
    tag: "4.5rc1-cuda"
    pullPolicy: IfNotPresent

  # Configuration that maps to marie.yml
  config:
    protocol: grpc
    port: 52000
    httpPort: 51000

  # Service discovery settings
  discovery:
    # etcd endpoints for service discovery
    etcdEndpoints: []
    # Discovery mechanism: etcd, kubernetes, static
    mechanism: kubernetes

  # Logging configuration
  logging:
    level: INFO
    format: json

  # Tracing configuration
  tracing:
    enabled: true
    exporterType: jaeger
    jaegerEndpoint: ""

# -----------------------------------------------------------------------------
# Server Configuration (combined gateway + scheduler)
# Runs: marie server --start --uses config/marie.yml
# -----------------------------------------------------------------------------
server:
  enabled: true
  replicas: 1

  image:
    repository: marieai/marie-gateway
    tag: "4.5rc1-cpu"

  config:
    configFile: /etc/marie/config/service/marie-gateway-4.0.0.yml
    extraSearchPaths: /etc/marie/config/extra_py_modules
    psqlDir: /marie/config/psql
    schemaDir: /marie/config/psql/schema
    metrics:
      enabled: true
      exporterHost: localhost
      exporterPort: 4317
    tracing:
      enabled: true
      exporterHost: localhost
      exporterPort: 4317

  service:
    type: ClusterIP
    port: 52000
    httpPort: 51000
    nodePorts:
      grpc: ""
      http: ""

  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

  # Ingress configuration
  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: marie.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  # Persistence for server state
  persistence:
    enabled: false
    storageClass: ""
    size: 10Gi

  # Pod settings
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Health checks
  probes:
    startup:
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 30
    liveness:
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 10
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 5

# -----------------------------------------------------------------------------
# Executor Configuration
# -----------------------------------------------------------------------------
executor:
  enabled: true

  # Define executor pools (CPU and GPU)
  pools:
    # CPU executor pool for general workloads
    - name: cpu-general
      enabled: true
      replicas: 2
      gpu: false

      image:
        repository: ""
        tag: ""

      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
        limits:
          cpu: "4"
          memory: "8Gi"

      nodeSelector: {}
      tolerations: []
      affinity: {}

      # Additional environment variables
      env: []

    # GPU executor pool for ML workloads
    - name: gpu-ocr
      enabled: true
      replicas: 1
      gpu: true

      image:
        repository: ""
        tag: ""

      resources:
        requests:
          cpu: "4"
          memory: "16Gi"
          nvidia.com/gpu: 1
        limits:
          cpu: "8"
          memory: "32Gi"
          nvidia.com/gpu: 1

      # GPU-specific node selection
      nodeSelector:
        # GKE: cloud.google.com/gke-accelerator: nvidia-tesla-t4
        # EKS: node.kubernetes.io/instance-type: g4dn.xlarge
        {}

      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule

      affinity: {}

      # Scale-to-zero configuration
      scaleToZero:
        enabled: true
        # Annotation to allow cluster autoscaler to evict pods
        annotations:
          cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

      env: []

  # Stateful executor settings (for executors needing persistent storage)
  stateful:
    enabled: false
    persistence:
      storageClass: ""
      size: 50Gi
      accessModes:
        - ReadWriteOnce

# -----------------------------------------------------------------------------
# PostgreSQL Configuration
# -----------------------------------------------------------------------------
postgresql:
  enabled: true

  # Use FerretDB DocumentDB image for MongoDB compatibility
  image:
    registry: ghcr.io
    repository: ferretdb/postgres-documentdb
    tag: "17-0.103.0"

  auth:
    postgresPassword: ""
    username: postgres
    password: ""
    database: postgres

  primary:
    persistence:
      enabled: true
      size: 20Gi

  # External PostgreSQL (when enabled=false)
  external:
    host: ""
    port: 5432
    database: marie
    username: marie
    existingSecret: ""
    existingSecretPasswordKey: password

# -----------------------------------------------------------------------------
# RabbitMQ Configuration
# -----------------------------------------------------------------------------
rabbitmq:
  enabled: true

  image:
    registry: docker.io
    repository: rabbitmq
    tag: "3-management-alpine"

  auth:
    username: marie
    password: ""

  persistence:
    enabled: true
    size: 8Gi

  # External RabbitMQ (when enabled=false)
  external:
    host: ""
    port: 5672
    username: marie
    existingSecret: ""
    existingSecretPasswordKey: password

# -----------------------------------------------------------------------------
# etcd Configuration
# -----------------------------------------------------------------------------
etcd:
  enabled: true

  replicaCount: 1

  image:
    registry: quay.io
    repository: coreos/etcd
    tag: "v3.6.1"

  auth:
    rbac:
      create: true
      rootPassword: ""

  persistence:
    enabled: true
    size: 8Gi

  # External etcd (when enabled=false)
  external:
    endpoints: []
    # - http://etcd-0:2379
    # - http://etcd-1:2379
    # - http://etcd-2:2379

# -----------------------------------------------------------------------------
# Valkey Configuration
# -----------------------------------------------------------------------------
valkey:
  enabled: true

  image:
    repository: valkey/valkey
    tag: "9-alpine"
    pullPolicy: IfNotPresent

  auth:
    enabled: false
    password: ""
    existingSecret: ""
    existingSecretPasswordKey: password

  service:
    port: 6379

  persistence:
    enabled: true
    storageClass: ""
    size: 8Gi

  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

  nodeSelector: {}
  tolerations: []
  affinity: {}

  # External Valkey (when enabled=false)
  external:
    host: ""
    port: 6379
    database: 0
    tls: false
    existingSecret: ""
    existingSecretPasswordKey: password

# -----------------------------------------------------------------------------
# MinIO Configuration (S3-compatible storage)
# -----------------------------------------------------------------------------
minio:
  enabled: true

  image:
    registry: docker.io
    repository: minio/minio
    tag: latest

  mode: standalone

  service:
    type: ClusterIP
    port: 8000
    consolePort: 9001

  auth:
    rootUser: minioadmin
    rootPassword: ""

  # Default buckets to create
  defaultBuckets: "marie"

  persistence:
    enabled: true
    size: 20Gi

  # Service account credentials for Marie
  provisioning:
    enabled: true
    users:
      - username: marie-access-key
        password: marie-secret-key
        policies:
          - readwrite

  # External MinIO (when enabled=false)
  external:
    endpoint: ""
    accessKey: ""
    secretKey: ""
    bucket: marie

# -----------------------------------------------------------------------------
# ClickHouse Configuration (Analytics Database)
# Used by: marie-ai for metrics and analytics
# -----------------------------------------------------------------------------
clickhouse:
  enabled: false

  image:
    repository: clickhouse/clickhouse-server
    tag: "latest"

  service:
    type: ClusterIP
    httpPort: 8123
    nativePort: 9000
    mysqlPort: 9004

  config:
    defaultDatabase: marie
    defaultUser: default
    defaultPassword: ""
    accessManagement: true
    maxMemoryUsage: "4000000000"
    maxMemoryUsageForUser: "3000000000"
    logLevel: information

  resources:
    requests:
      cpu: "2"
      memory: "4Gi"
    limits:
      cpu: "8"
      memory: "16Gi"

  persistence:
    enabled: true
    storageClass: ""
    size: 100Gi
    logs:
      enabled: false
      size: 10Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Gitea Configuration (Git Service)
# Used by: marie-studio for source code management
# -----------------------------------------------------------------------------
gitea:
  enabled: false

  image:
    repository: gitea/gitea
    tag: "latest"

  service:
    type: ClusterIP
    httpPort: 3000
    sshPort: 22

  config:
    appName: "Marie Studio Git"
    runMode: prod
    domain: localhost
    rootURL: "http://localhost:3000"
    sshDomain: localhost
    sshPort: 22
    sshListenPort: 22
    userUID: 1000
    userGID: 1000
    installLock: false
    secretKey: ""
    disableRegistration: false
    requireSignInView: false
    logLevel: info

  # Uses shared PostgreSQL by default
  database:
    type: postgres
    host: ""
    port: 5432
    name: gitea
    user: ""
    password: ""
    sslMode: disable

  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"

  persistence:
    enabled: true
    storageClass: ""
    size: 20Gi

  ingress:
    enabled: false
    className: nginx
    annotations: {}
    hosts:
      - host: git.example.com
        paths:
          - path: /
            pathType: Prefix
    tls: []

  nodeSelector: {}
  tolerations: []
  affinity: {}

# -----------------------------------------------------------------------------
# Storage Configuration
# -----------------------------------------------------------------------------
storage:
  # Storage backend: s3, minio, gcs, azure, local
  type: minio

  s3:
    bucket: marie
    region: us-east-1
    endpoint: ""
    accessKey: ""
    secretKey: ""
    existingSecret: ""

  gcs:
    bucket: marie-documents
    project: ""
    credentialsJson: ""
    existingSecret: ""

  azure:
    container: marie-documents
    accountName: ""
    accountKey: ""
    existingSecret: ""

# -----------------------------------------------------------------------------
# Observability Configuration
# -----------------------------------------------------------------------------
observability:
  # Prometheus integration
  prometheus:
    enabled: true
    # Create ServiceMonitor for Prometheus Operator
    serviceMonitor:
      enabled: true
      interval: 30s
      scrapeTimeout: 10s
      labels: {}

  # Grafana dashboards
  grafana:
    # Install pre-built dashboards
    dashboards:
      enabled: true

  # Distributed tracing
  jaeger:
    enabled: false
    # If enabled, specify agent/collector endpoints
    agent:
      host: jaeger-agent
      port: 6831
    collector:
      endpoint: ""

  # OpenTelemetry Collector
  otel:
    enabled: false
    endpoint: ""
    insecure: true

# -----------------------------------------------------------------------------
# Security Configuration
# -----------------------------------------------------------------------------
security:
  # Pod Security Standards
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000

  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL

  # Network Policies
  networkPolicy:
    enabled: false
    # Ingress rules
    ingress: []
    # Egress rules
    egress: []

  # TLS configuration
  tls:
    enabled: false
    secretName: ""
    # Generate self-signed certificates
    selfSigned: false

# -----------------------------------------------------------------------------
# Sandbox Configuration
# Governance objects (ResourceQuota, LimitRange, NetworkPolicy, Namespace PSA
# labels) are rendered only when sandbox.enabled=true.  Use values-sandbox.yaml
# as the overlay; this section only carries the off-by-default flag and the
# sizing presets referenced by the governance template.
# -----------------------------------------------------------------------------
sandbox:
  # Set to true via values-sandbox.yaml overlay (never in production values).
  enabled: false
  host: ''
  size: small
  egress:
    dns:
      enabled: true
      clusterDnsCidr: '10.96.0.0/12'
    pluginRegistry:
      enabled: false
      cidr: ''
      port: 443
    llmGateway:
      enabled: false
      cidr: ''
      port: 443

  # ---- Seed configuration (Wave 1 + Studio-orchestrated seeding) ----------
  # Populated via values-sandbox.yaml.
  seed:
    # Name of the k8s Secret that holds the sandbox admin API key.
    # Key within the Secret is controlled by adminApiKeySecretKey below.
    # If empty, defaults to <release-fullname>-sandbox-admin.
    # The Secret must be pre-created before install (Slice 6 automates this
    # via ESO/Sealed Secrets/SOPS).
    adminApiKeySecret: ''
    adminApiKeySecretKey: 'api_key'

    # ---- Informational metadata read by the Studio Sandbox Service --------
    # Blueprint + plugin seeding (Waves 2–3) is Studio-orchestrated: after
    # Argo reports the sandbox Synced and the Wave-1 defaults Job is done,
    # the Studio Sandbox Service calls the sandbox gateway using Studio's
    # existing blueprint-import.service with these values.
    # They are NOT consumed by any in-namespace Job.

    # Blueprint identifier to install after defaults, e.g.
    # "ner-vlm-ocr-entity-extraction".  Empty = no blueprint seeding.
    blueprintId: ''

    # Plugin refs from the blueprint's extension_package.
    # Each entry must have at minimum: { packageId: "...", version: "..." }
    # Read by the Studio Sandbox Service after blueprint import completes.
    pluginRefs: []

  # ---- Secret delivery (Slice 6 — External Secrets Operator) -------------
  # Renders ExternalSecret CRDs (external-secrets.io/v1) that materialize
  # per-sandbox Kubernetes Secrets from a configured SecretStore.
  # Gated on BOTH sandbox.enabled=true AND sandbox.secrets.enabled=true.
  # See templates/sandbox-secrets.yaml.
  #
  # Alternatives (not implemented): Sealed Secrets, SOPS + Argo plugin.
  secrets:
    # Set to true via values-sandbox.yaml overlay.  Never enable in production.
    enabled: false

    # Reference to the ClusterSecretStore or SecretStore to read from.
    # The named store must be pre-created on the cluster (platform prerequisite).
    storeRef:
      name: ""             # e.g. "marie-sandbox-secrets" or "vault-backend"
      kind: ClusterSecretStore   # ClusterSecretStore | SecretStore

    # How often ESO re-reads from the remote store.
    refreshInterval: "1h"

    # Per-secret configuration.  The chart renders one ExternalSecret per entry
    # whose remoteKey is non-empty.
    #
    # Fields per entry:
    #   secretName  — name of the Kubernetes Secret ESO creates in the sandbox ns.
    #                 Defaults to <fullname>-sandbox-<purpose> when empty.
    #   remoteKey   — path/key in the remote store; MUST be set per sandbox.
    #                 STUDIO RENDERER populates this in values.yaml at create time.
    #   property    — property within the remote secret (e.g. vault KV field name).
    secrets:
      adminApiKey:
        # MUST produce Secret named <fullname>-sandbox-admin with key api_key.
        # Matches sandbox.seed.adminApiKeySecret default + adminApiKeySecretKey default.
        secretName: ""
        remoteKey: ""      # STUDIO RENDERER MUST SET per sandbox
        property: api_key

      dbPassword:
        # Seam: set postgresql.auth.existingSecret=<secretName> in values overlay.
        secretName: ""
        remoteKey: ""      # STUDIO RENDERER MUST SET per sandbox
        property: password

      storageCredentials:
        # Seam: set minio.auth.existingSecret=<secretName> in values overlay.
        secretName: ""
        remoteKey: ""      # STUDIO RENDERER MUST SET per sandbox
        accessKeyProperty: access-key
        secretKeyProperty: secret-key

      runnerSecret:
        # Seam: reference in executor.pools[*].env in values overlay.
        secretName: ""
        remoteKey: ""      # STUDIO RENDERER MUST SET per sandbox
        property: token

sandboxSizes:
  small:
    quota:
      cpu: '8'
      memory: 16Gi
      pods: '20'
      pvcs: '8'
      storage: 100Gi
    limits:
      defaultCpu: '500m'
      defaultMemory: 512Mi
      defaultRequestCpu: '100m'
      defaultRequestMemory: 128Mi
      maxCpu: '4'
      maxMemory: 8Gi
  medium:
    quota:
      cpu: '24'
      memory: 48Gi
      pods: '40'
      pvcs: '12'
      storage: 300Gi
    limits:
      defaultCpu: '1'
      defaultMemory: 1Gi
      defaultRequestCpu: '200m'
      defaultRequestMemory: 256Mi
      maxCpu: '8'
      maxMemory: 16Gi
  large:
    quota:
      cpu: '64'
      memory: 128Gi
      pods: '80'
      pvcs: '20'
      storage: 1Ti
    limits:
      defaultCpu: '2'
      defaultMemory: 2Gi
      defaultRequestCpu: '500m'
      defaultRequestMemory: 512Mi
      maxCpu: '16'
      maxMemory: 32Gi

# -----------------------------------------------------------------------------
# ServiceAccount Configuration
# -----------------------------------------------------------------------------
serviceAccount:
  # Create a ServiceAccount
  create: true
  # Name of the ServiceAccount (auto-generated if empty)
  name: ""
  # Annotations for the ServiceAccount
  annotations: {}
  # Automount service account token
  automountServiceAccountToken: true
