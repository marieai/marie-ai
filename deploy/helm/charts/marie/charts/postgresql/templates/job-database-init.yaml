{{- $lifecycle := .Values.global.lifecycle | default dict }}
{{- if and .Values.enabled .Values.databaseInit.enabled ($lifecycle.managed | default false) (eq ($lifecycle.phase | default "active") "migrating") (gt (len .Values.databaseInit.databases) 0) }}
{{- range .Values.databaseInit.databases }}
{{- if not (regexMatch "^[a-z][a-z0-9_]{0,62}$" .) }}
{{- fail (printf "postgresql.databaseInit database %q must match ^[a-z][a-z0-9_]{0,62}$" .) }}
{{- end }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgresql.fullname" . }}-database-init
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
    app.kubernetes.io/component: database-init
  annotations:
    "helm.sh/hook": pre-upgrade
    "helm.sh/hook-weight": {{ .Values.databaseInit.hook.weight | quote }}
    "helm.sh/hook-delete-policy": {{ .Values.databaseInit.hook.deletePolicy | quote }}
spec:
  backoffLimit: {{ .Values.databaseInit.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.databaseInit.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "postgresql.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: database-init
    spec:
      restartPolicy: Never
      containers:
        - name: database-init
          image: {{ include "postgresql.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -ec
            - |
              until pg_isready -h {{ include "postgresql.fullname" . }} -U "$POSTGRES_USER" -d postgres; do
                sleep 2
              done
              {{- range .Values.databaseInit.databases }}
              if [ "$(psql -h {{ include "postgresql.fullname" $ }} -U "$POSTGRES_USER" -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ . }}'")" != "1" ]; then
                psql -h {{ include "postgresql.fullname" $ }} -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "{{ . }}"'
              fi
              {{- end }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.auth.username | default "postgres" | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.secretName" . }}
                  key: postgres-password
          resources:
            {{- toYaml .Values.databaseInit.resources | nindent 12 }}
{{- end }}
