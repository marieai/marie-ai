{{- if and .Values.enabled .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "postgresql.fullname" . }}-migrate
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "postgresql.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgresql-migration
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: {{ include "postgresql.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: PGHOST
              value: {{ include "postgresql.fullname" . }}
            - name: PGPORT
              value: {{ .Values.service.port | quote }}
            - name: PGUSER
              value: {{ .Values.auth.username | default "postgres" | quote }}
            - name: PGDATABASE
              value: {{ .Values.auth.database | default "postgres" | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "postgresql.secretName" . }}
                  key: password
          command:
            - /bin/sh
            - -ec
            - |
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d "$PGDATABASE"; do
                sleep 2
              done
              for sql in /migrations/[0-9][0-9][0-9]_*.sql; do
                [ -e "$sql" ] || continue
                echo "Applying $sql"
                psql -v ON_ERROR_STOP=1 -f "$sql"
              done
              for sql in /migrations/lease-[0-9][0-9][0-9]_*.sql; do
                [ -e "$sql" ] || continue
                echo "Applying $sql"
                psql -v ON_ERROR_STOP=1 -f "$sql"
              done
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: {{ include "postgresql.fullname" . }}-migrations
{{- end }}
