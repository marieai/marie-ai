{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "valkey.fullname" . }}
  labels:
    {{- include "valkey.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  selector:
    {{- include "valkey.selectorLabels" . | nindent 4 }}
  ports:
    - name: tcp-valkey
      port: {{ .Values.service.port }}
      targetPort: valkey
      protocol: TCP
{{- end }}
