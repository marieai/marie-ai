{{- if .Values.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hyperdx.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperdx.labels" . | nindent 4 }}
spec:
  progressDeadlineSeconds: {{ .Values.progressDeadlineSeconds }}
  replicas: {{ include "marie.infrastructureReplicas" (dict "root" . "replicas" .Values.replicas) }}
  selector:
    matchLabels:
      {{- include "hyperdx.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hyperdx.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hyperdx
          image: {{ include "hyperdx.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POSTGRES_PASSWORD
              {{- if .Values.postgresql.password }}
              value: {{ .Values.postgresql.password | quote }}
              {{- else }}
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgresql" .Release.Name }}
                  key: postgres-password
              {{- end }}
            # FerretDB delegates authentication to PostgreSQL and supports SCRAM-SHA-256 only.
            # Kubernetes expands $(POSTGRES_PASSWORD); it must be URL-safe
            - name: MONGO_URI
              value: "mongodb://{{ .Values.postgresql.username }}:$(POSTGRES_PASSWORD)@{{ .Values.mongo.host | default (printf "%s-ferretdb" .Release.Name) }}:{{ .Values.mongo.port }}/{{ .Values.mongo.database }}?authMechanism=SCRAM-SHA-256"
            - name: HYPERDX_LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: HYPERDX_APP_PORT
              value: "8080"
            - name: FRONTEND_URL
              value: {{ .Values.config.frontendUrl | quote }}
            - name: DEFAULT_CONNECTIONS
              valueFrom:
                secretKeyRef:
                  name: {{ include "hyperdx.fullname" . }}
                  key: default-connections
            - name: DEFAULT_SOURCES
              value: {{ include "hyperdx.defaultSources" . | quote }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
