{{- if .Values.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hyperdx.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "hyperdx.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Holds the ClickHouse password, so it lives in a Secret rather than the pod spec
  default-connections: {{ include "hyperdx.defaultConnections" . | quote }}
{{- end }}
