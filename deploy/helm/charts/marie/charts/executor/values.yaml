# Executor subchart default values

global:
  imageRegistry: ""
  imagePullSecrets: []
  serviceAccount:
    create: true
    name: ""
  marie:
    image:
      repository: marieai/marie
      tag: "5.0.1-cuda"
      digest: ""
    debugQueryPlanner: "FALSE"
  grpc:
    trace: ""
    verbosity: ""
  openai:
    apiBase: ""
    apiKey: ""
    existingSecret: ""
    existingSecretApiKeyKey: api-key
  valkey:
    enabled: false
    host: ""
    port: 6379
    database: 0
    tls: false
    auth:
      enabled: false
      existingSecret: ""
      existingSecretPasswordKey: password
  llmQueue:
    enabled: false
    poolId: default
    fabricGroupId: default
    gatewayId: default
    producerId: ""
    producerTtlSeconds: 30
    producerRefreshIntervalSeconds: 10
    replyQueueTtlSeconds: 300
    replyPopTimeoutSeconds: "1.0"
    dispatchPopTimeoutSeconds: "1.0"
    maxBatchItems: 8
    maxBatchWaitMs: 100
    maxBufferedRequestsPerPool: 32
    maxInlinePayloadBytes: "16777216"

enabled: true

llmTracking:
  enabled: true

gpuMonitor:
  enabled: true

# Define executor pools (can have multiple CPU and GPU pools)
pools:
  # CPU executor pool for general workloads
  - name: cpu-general
    enabled: true
    replicas: 2
    progressDeadlineSeconds: 600
    gpu: false
    stateful: false
    strategy:
      type: RollingUpdate
      maxSurge: 1
      maxUnavailable: 0

    image:
      repository: marieai/marie
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 52010

    configFile: /etc/marie/config/service/extract/marie-extract-4.0.0.yml

    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "4"
        memory: "8Gi"

    nodeSelector: {}
    tolerations: []
    affinity: {}

    env: []

    probes:
      startup:
        initialDelaySeconds: 5
        periodSeconds: 10
        failureThreshold: 30
      liveness:
        initialDelaySeconds: 30
        periodSeconds: 5
        timeoutSeconds: 10
      readiness:
        initialDelaySeconds: 5
        periodSeconds: 5
        timeoutSeconds: 5

  # GPU executor pool for ML workloads (OCR, Classification, etc.)
  - name: gpu-ocr
    enabled: true
    replicas: 1
    gpu: true
    stateful: false

    image:
      repository: marieai/marie
      tag: ""
      digest: ""
      pullPolicy: IfNotPresent

    service:
      type: ClusterIP
      port: 52020

    configFile: /etc/marie/config/service/extract/marie-extract-4.0.0.yml

    resources:
      requests:
        cpu: "4"
        memory: "16Gi"
        nvidia.com/gpu: 1
      limits:
        cpu: "8"
        memory: "32Gi"
        nvidia.com/gpu: 1

    # GPU-specific node selection
    nodeSelector: {}
    # Example for GKE:
    # nodeSelector:
    #   cloud.google.com/gke-accelerator: nvidia-tesla-t4

    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule

    affinity: {}

    # Scale-to-zero support
    scaleToZero:
      enabled: true
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"

    env: []

    probes:
      startup:
        initialDelaySeconds: 30
        periodSeconds: 10
        failureThreshold: 60
      liveness:
        initialDelaySeconds: 60
        periodSeconds: 10
        timeoutSeconds: 15
      readiness:
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 10

# Stateful executor settings (for executors needing persistent storage)
stateful:
  enabled: false
  persistence:
    storageClass: ""
    size: 50Gi
    accessModes:
      - ReadWriteOnce

podSecurityContext: {}
securityContext: {}
