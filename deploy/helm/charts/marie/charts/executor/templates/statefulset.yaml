{{- if .Values.enabled }}
{{- range $pool := .Values.pools }}
{{- if and $pool.enabled $pool.stateful }}
{{- $image := default dict $pool.image }}
{{- $service := default dict $pool.service }}
{{- $port := default 52010 $service.port }}
{{- $probes := default dict $pool.probes }}
{{- $startupProbe := default dict $probes.startup }}
{{- $livenessProbe := default dict $probes.liveness }}
{{- $readinessProbe := default dict $probes.readiness }}
{{- $postgresql := $.Values.global.postgresql | default dict }}
{{- $postgresqlAuth := $postgresql.auth | default dict }}
{{- $postgresqlExternal := $postgresql.external | default dict }}
{{- $rabbitmq := $.Values.global.rabbitmq | default dict }}
{{- $rabbitmqAuth := $rabbitmq.auth | default dict }}
{{- $rabbitmqExternal := $rabbitmq.external | default dict }}
{{- $etcd := $.Values.global.etcd | default dict }}
{{- $etcdExternal := $etcd.external | default dict }}
{{- $minio := $.Values.global.minio | default dict }}
{{- $minioExternal := $minio.external | default dict }}
{{- $storage := $.Values.global.storage | default dict }}
{{- $storageS3 := $storage.s3 | default dict }}
{{- $grpc := $.Values.global.grpc | default dict }}
{{- $openai := $.Values.global.openai | default dict }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "executor.poolFullname" (list $pool $.Release.Name) }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "executor.poolLabels" (list $pool $) | nindent 4 }}
spec:
  serviceName: {{ include "executor.poolFullname" (list $pool $.Release.Name) }}-headless
  replicas: {{ $pool.replicas }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "executor.poolSelectorLabels" (list $pool $.Release.Name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "executor.poolSelectorLabels" (list $pool $.Release.Name) | nindent 8 }}
        app.kubernetes.io/component: executor
        pod_type: executor
        {{- if $pool.gpu }}
        marie.ai/gpu: "true"
        {{- end }}
      annotations:
        {{- if and $pool.scaleToZero $pool.scaleToZero.enabled }}
        {{- toYaml $pool.scaleToZero.annotations | nindent 8 }}
        {{- end }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "executor.serviceAccountName" $ }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: executor
          image: {{ include "executor.poolImage" (list $pool $.Values.global $.Chart.AppVersion) }}
          imagePullPolicy: {{ $image.pullPolicy | default "IfNotPresent" }}
          args:
            - server
            - --start
            - --uses
            - {{ $pool.configFile | default "/etc/marie/config/service/extract/marie-extract-4.0.0.yml" }}
          ports:
            - name: grpc
              containerPort: {{ $port }}
              protocol: TCP
          {{- with $.Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-config
          env:
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: K8S_STATEFULSET_NAME
              value: {{ include "executor.poolFullname" (list $pool $.Release.Name) }}
            - name: K8S_NAMESPACE_NAME
              value: {{ $.Release.Namespace }}
            - name: K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: MARIE_COMPONENT
              value: executor
            - name: EXECUTOR_POOL
              value: {{ $pool.name | quote }}
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: MARIE_CACHE_SKIP_LOAD
              value: "true"
            - name: MARIE_DEFAULT_MOUNT
              value: /etc/marie
            - name: MARIE_LOG_CONFIG
              value: docker
            - name: MARIE_DEPLOYMENT_NAME
              value: {{ $.Release.Name | quote }}
            - name: MARIE_DEBUG_QUERY_PLANNER
              value: {{ $.Values.global.marie.debugQueryPlanner | default "FALSE" | quote }}
            - name: COLUMNS
              value: "180"
            - name: JINA_MP_START_METHOD
              value: spawn
            - name: JINA_LOG_LEVEL
              value: INFO
            {{- if $grpc.trace }}
            - name: GRPC_TRACE
              value: {{ $grpc.trace | quote }}
            {{- end }}
            {{- if $grpc.verbosity }}
            - name: GRPC_VERBOSITY
              value: {{ $grpc.verbosity | quote }}
            {{- end }}
            {{- if $openai.apiBase }}
            - name: OPENAI_API_BASE
              value: {{ $openai.apiBase | quote }}
            {{- end }}
            {{- if $openai.apiKey }}
            - name: OPENAI_API_KEY
              value: {{ $openai.apiKey | quote }}
            {{- else if $openai.existingSecret }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $openai.existingSecret }}
                  key: {{ $openai.existingSecretApiKeyKey | default "api-key" }}
            {{- end }}
            {{- if $pool.gpu }}
            - name: NVIDIA_VISIBLE_DEVICES
              value: "all"
            - name: CUDA_VISIBLE_DEVICES
              value: "0"
            {{- end }}
            {{- if $postgresql.enabled }}
            - name: DATABASE_HOST
              value: {{ printf "%s-postgresql" $.Release.Name | quote }}
            - name: POSTGRES_HOSTNAME
              value: {{ printf "%s-postgresql" $.Release.Name | quote }}
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME
              value: {{ $postgresqlAuth.database | default "postgres" | quote }}
            - name: DATABASE_USER
              value: {{ $postgresqlAuth.username | default "postgres" | quote }}
            - name: POSTGRES_USER
              value: {{ $postgresqlAuth.username | default "postgres" | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgresql" $.Release.Name }}
                  key: postgres-password
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-postgresql" $.Release.Name }}
                  key: postgres-password
            {{- else if $postgresqlExternal.host }}
            - name: DATABASE_HOST
              value: {{ $postgresqlExternal.host | quote }}
            - name: POSTGRES_HOSTNAME
              value: {{ $postgresqlExternal.host | quote }}
            - name: DATABASE_PORT
              value: {{ $postgresqlExternal.port | default 5432 | quote }}
            - name: DATABASE_NAME
              value: {{ $postgresqlExternal.database | default "marie" | quote }}
            - name: DATABASE_USER
              value: {{ $postgresqlExternal.username | default "marie" | quote }}
            - name: POSTGRES_USER
              value: {{ $postgresqlExternal.username | default "marie" | quote }}
            {{- if $postgresqlExternal.existingSecret }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresqlExternal.existingSecret }}
                  key: {{ $postgresqlExternal.existingSecretPasswordKey | default "password" }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresqlExternal.existingSecret }}
                  key: {{ $postgresqlExternal.existingSecretPasswordKey | default "password" }}
            {{- end }}
            {{- end }}
            {{- if $etcd.enabled }}
            - name: ETCD_ENDPOINTS
              value: {{ printf "%s-etcd:2379" $.Release.Name | quote }}
            - name: ETCD_HOSTNAME
              value: {{ printf "%s-etcd" $.Release.Name | quote }}
            - name: ETCD_PORT
              value: "2379"
            {{- else if $etcdExternal.endpoints }}
            - name: ETCD_ENDPOINTS
              value: {{ join "," $etcdExternal.endpoints | quote }}
            - name: ETCD_HOSTNAME
              value: {{ first $etcdExternal.endpoints | quote }}
            - name: ETCD_PORT
              value: "2379"
            {{- end }}
            - name: OTEL_EXPORTER_HOST
              value: localhost
            - name: OTEL_EXPORTER_ENDPOINT
              value: http://localhost:4317
            - name: CLICKHOUSE_HOSTNAME
              value: {{ printf "%s-clickhouse" $.Release.Name | quote }}
            {{- if $rabbitmq.enabled }}
            - name: RABBITMQ_HOST
              value: {{ printf "%s-rabbitmq" $.Release.Name | quote }}
            - name: RABBIT_MQ_HOSTNAME
              value: {{ printf "%s-rabbitmq" $.Release.Name | quote }}
            - name: RABBITMQ_PORT
              value: "5672"
            - name: RABBIT_MQ_PORT
              value: "5672"
            - name: RABBITMQ_USER
              value: {{ $rabbitmqAuth.username | default "user" | quote }}
            - name: RABBIT_MQ_USERNAME
              value: {{ $rabbitmqAuth.username | default "user" | quote }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-rabbitmq" $.Release.Name }}
                  key: rabbitmq-password
            - name: RABBIT_MQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-rabbitmq" $.Release.Name }}
                  key: rabbitmq-password
            {{- else if $rabbitmqExternal.host }}
            - name: RABBITMQ_HOST
              value: {{ $rabbitmqExternal.host | quote }}
            - name: RABBIT_MQ_HOSTNAME
              value: {{ $rabbitmqExternal.host | quote }}
            - name: RABBITMQ_PORT
              value: {{ $rabbitmqExternal.port | default 5672 | quote }}
            - name: RABBIT_MQ_PORT
              value: {{ $rabbitmqExternal.port | default 5672 | quote }}
            - name: RABBITMQ_USER
              value: {{ $rabbitmqExternal.username | default "user" | quote }}
            - name: RABBIT_MQ_USERNAME
              value: {{ $rabbitmqExternal.username | default "user" | quote }}
            {{- if $rabbitmqExternal.existingSecret }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $rabbitmqExternal.existingSecret }}
                  key: {{ $rabbitmqExternal.existingSecretPasswordKey | default "password" }}
            - name: RABBIT_MQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $rabbitmqExternal.existingSecret }}
                  key: {{ $rabbitmqExternal.existingSecretPasswordKey | default "password" }}
            {{- end }}
            {{- end }}
            {{- if $minio.enabled }}
            - name: S3_ENDPOINT_URL
              value: http://{{ printf "%s-minio" $.Release.Name }}:{{ $minio.port | default 8000 }}
            - name: S3_BUCKET_NAME
              value: {{ $minio.defaultBuckets | default "marie" | quote }}
            - name: S3_REGION
              value: us-east-1
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-minio" $.Release.Name }}
                  key: root-user
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ printf "%s-minio" $.Release.Name }}
                  key: root-password
            {{- else if eq ($storage.type | default "") "s3" }}
            - name: S3_ENDPOINT_URL
              value: {{ $storageS3.endpoint | default $minioExternal.endpoint | quote }}
            - name: S3_BUCKET_NAME
              value: {{ $storageS3.bucket | default $minioExternal.bucket | default "marie" | quote }}
            - name: S3_REGION
              value: {{ $storageS3.region | default "us-east-1" | quote }}
            {{- if $storageS3.existingSecret }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ $storageS3.existingSecret }}
                  key: {{ $storageS3.existingSecretAccessKeyKey | default "access-key" }}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $storageS3.existingSecret }}
                  key: {{ $storageS3.existingSecretSecretKeyKey | default "secret-key" }}
            {{- end }}
            {{- end }}
            {{- if $.Values.global.valkey.enabled }}
            {{- $valkeyHost := default (printf "%s-valkey" $.Release.Name) $.Values.global.valkey.host }}
            {{- $valkeyPort := default 6379 $.Values.global.valkey.port }}
            {{- $valkeyDatabase := default 0 $.Values.global.valkey.database }}
            {{- $valkeyTls := default false $.Values.global.valkey.tls }}
            {{- if $.Values.global.valkey.auth.enabled }}
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ default (printf "%s-valkey-auth" $.Release.Name) $.Values.global.valkey.auth.existingSecret }}
                  key: {{ $.Values.global.valkey.auth.existingSecretPasswordKey | default "password" }}
            {{- end }}
            - name: LLM_QUEUE_ENABLED
              value: {{ $.Values.global.llmQueue.enabled | default false | quote }}
            - name: LLM_QUEUE_VALKEY_URL
              value: {{ printf "%s://%s%s:%v/%v" (ternary "rediss" "redis" $valkeyTls) (ternary ":$(VALKEY_PASSWORD)@" "" $.Values.global.valkey.auth.enabled) $valkeyHost $valkeyPort $valkeyDatabase | quote }}
            - name: LLM_QUEUE_POOL_ID
              value: {{ $.Values.global.llmQueue.poolId | default "default" | quote }}
            - name: LLM_QUEUE_FABRIC_GROUP_ID
              value: {{ $.Values.global.llmQueue.fabricGroupId | default "default" | quote }}
            - name: LLM_QUEUE_GATEWAY_ID
              value: {{ $.Values.global.llmQueue.gatewayId | default "default" | quote }}
            - name: LLM_QUEUE_PRODUCER_ID
              value: {{ $.Values.global.llmQueue.producerId | default "" | quote }}
            - name: LLM_QUEUE_PRODUCER_TTL_SECONDS
              value: {{ $.Values.global.llmQueue.producerTtlSeconds | default 30 | quote }}
            - name: LLM_QUEUE_PRODUCER_REFRESH_INTERVAL_SECONDS
              value: {{ $.Values.global.llmQueue.producerRefreshIntervalSeconds | default 10 | quote }}
            - name: LLM_QUEUE_REPLY_QUEUE_TTL_SECONDS
              value: {{ $.Values.global.llmQueue.replyQueueTtlSeconds | default 300 | quote }}
            - name: LLM_QUEUE_REPLY_POP_TIMEOUT_SECONDS
              value: {{ $.Values.global.llmQueue.replyPopTimeoutSeconds | default "1.0" | quote }}
            - name: LLM_QUEUE_DISPATCH_POP_TIMEOUT_SECONDS
              value: {{ $.Values.global.llmQueue.dispatchPopTimeoutSeconds | default "1.0" | quote }}
            - name: LLM_QUEUE_MAX_BATCH_ITEMS
              value: {{ $.Values.global.llmQueue.maxBatchItems | default 8 | quote }}
            - name: LLM_QUEUE_MAX_BATCH_WAIT_MS
              value: {{ $.Values.global.llmQueue.maxBatchWaitMs | default 100 | quote }}
            - name: LLM_QUEUE_MAX_BUFFERED_REQUESTS_PER_POOL
              value: {{ $.Values.global.llmQueue.maxBufferedRequestsPerPool | default 32 | quote }}
            - name: LLM_QUEUE_MAX_INLINE_PAYLOAD_BYTES
              value: {{ $.Values.global.llmQueue.maxInlinePayloadBytes | default "16777216" | quote }}
            {{- end }}
            {{- with $pool.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: grpc
            initialDelaySeconds: {{ $startupProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ $startupProbe.periodSeconds | default 10 }}
            failureThreshold: {{ $startupProbe.failureThreshold | default 30 }}
            timeoutSeconds: {{ $startupProbe.timeoutSeconds | default 10 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: grpc
            initialDelaySeconds: {{ $livenessProbe.initialDelaySeconds | default 30 }}
            periodSeconds: {{ $livenessProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ $livenessProbe.timeoutSeconds | default 10 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: grpc
            initialDelaySeconds: {{ $readinessProbe.initialDelaySeconds | default 5 }}
            periodSeconds: {{ $readinessProbe.periodSeconds | default 5 }}
            timeoutSeconds: {{ $readinessProbe.timeoutSeconds | default 5 }}
          resources:
            {{- toYaml $pool.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/marie/config/service/extract
              readOnly: true
            - name: data
              mountPath: /data
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: config
          configMap:
            name: {{ $.Release.Name }}-executor-config
      {{- with $pool.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pool.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pool.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "executor.poolLabels" (list $pool $) | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml $.Values.stateful.persistence.accessModes | nindent 10 }}
        {{- if $.Values.stateful.persistence.storageClass }}
        storageClassName: {{ $.Values.stateful.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ $.Values.stateful.persistence.size }}
{{- end }}
{{- end }}
{{- end }}
