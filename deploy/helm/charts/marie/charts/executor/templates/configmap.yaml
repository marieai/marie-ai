{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-executor-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "executor.labels" . | nindent 4 }}
data:
  {{- $postgresql := .Values.global.postgresql | default dict }}
  {{- $postgresqlAuth := $postgresql.auth | default dict }}
  {{- $postgresPassword := $postgresqlAuth.password | default $postgresqlAuth.postgresPassword | default "marie-password" }}
  {{- $extractConfig := .Files.Get "files/service/extract/marie-extract-4.0.0.yml" }}
  {{- $extractConfig = replace "__ETCD_HOST__" (printf "%s-etcd" .Release.Name) $extractConfig }}
  {{- $extractConfig = replace "__POSTGRES_HOST__" (printf "%s-postgresql" .Release.Name) $extractConfig }}
  {{- $extractConfig = replace "__POSTGRES_PASSWORD__" $postgresPassword $extractConfig }}
  {{- $extractConfig = replace "__CLICKHOUSE_HOST__" (printf "%s-clickhouse" .Release.Name) $extractConfig }}
  {{- $extractConfig = replace "__OTEL_HOST__" "localhost" $extractConfig }}
  {{- $extractConfig = replace "__LLM_TRACKING_ENABLED__" (ternary "true" "false" .Values.llmTracking.enabled) $extractConfig }}
  {{- $extractConfig = replace "__GPU_MONITOR_ENABLED__" (ternary "true" "false" .Values.gpuMonitor.enabled) $extractConfig }}
  marie-extract-4.0.0.yml: |
{{ $extractConfig | indent 4 }}
  # Executor pools configuration
  EXECUTOR_POOLS: |
    {{- range $pool := .Values.pools }}
    {{- if $pool.enabled }}
    {{- $service := default dict $pool.service }}
    - name: {{ $pool.name }}
      gpu: {{ $pool.gpu }}
      replicas: {{ $pool.replicas }}
      port: {{ $service.port | default 52010 }}
    {{- end }}
    {{- end }}
{{- end }}
