{{- if .Values.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "etcd.fullname" . }}
  labels:
    {{- include "etcd.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "etcd.selectorLabels" . | nindent 4 }}
  ports:
    - name: client
      port: {{ .Values.service.clientPort }}
      targetPort: client
      protocol: TCP
    - name: peer
      port: {{ .Values.service.peerPort }}
      targetPort: peer
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "etcd.headlessName" . }}
  labels:
    {{- include "etcd.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "etcd.selectorLabels" . | nindent 4 }}
  ports:
    - name: client
      port: {{ .Values.service.clientPort }}
      targetPort: client
      protocol: TCP
    - name: peer
      port: {{ .Values.service.peerPort }}
      targetPort: peer
      protocol: TCP
{{- end }}
