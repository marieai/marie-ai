enabled: true
replicaCount: 1

image:
  registry: quay.io
  repository: coreos/etcd
  tag: "v3.7.0"
  digest: ""
  pullPolicy: IfNotPresent

autoCompaction:
  mode: periodic
  retention: 1h

quotaBackendBytes: "4294967296"

service:
  type: ClusterIP
  clientPort: 2379
  peerPort: 2380
  annotations: {}

persistence:
  enabled: true
  storageClass: ""
  size: 8Gi
  accessModes:
    - ReadWriteOnce

resources: {}
nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}
podSecurityContext: {}
securityContext: {}
