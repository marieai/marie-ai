{{- if .Values.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "server.fullname" . }}-psql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "server.labels" . | nindent 4 }}
data:
  cron_job_init.sql: |
{{ .Files.Get "files/psql/cron_job_init.sql" | indent 4 }}
{{- range $path, $_ := .Files.Glob "files/psql/schema/*.sql" }}
  {{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- range $path, $_ := .Files.Glob "files/psql/schema/lease/*.sql" }}
  lease-{{ base $path }}: |
{{ $.Files.Get $path | indent 4 }}
{{- end }}
{{- end }}
