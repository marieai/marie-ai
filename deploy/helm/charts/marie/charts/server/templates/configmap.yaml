{{- if .Values.enabled }}
{{- $postgresql := .Values.global.postgresql | default dict }}
{{- $postgresqlAuth := $postgresql.auth | default dict }}
{{- $postgresqlExternal := $postgresql.external | default dict }}
{{- $rabbitmq := .Values.global.rabbitmq | default dict }}
{{- $rabbitmqExternal := $rabbitmq.external | default dict }}
{{- $etcd := .Values.global.etcd | default dict }}
{{- $etcdExternal := $etcd.external | default dict }}
{{- $minio := .Values.global.minio | default dict }}
{{- $minioExternal := $minio.external | default dict }}
{{- $storage := .Values.global.storage | default dict }}
{{- $storageS3 := $storage.s3 | default dict }}
# Environment variables ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "server.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "server.labels" . | nindent 4 }}
data:
  MARIE_PORT: {{ .Values.service.port | quote }}
  MARIE_HTTP_PORT: {{ .Values.service.httpPort | quote }}
  LOG_LEVEL: {{ .Values.global.marie.logging.level | default "INFO" | quote }}
---
# Marie configuration file ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "server.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "server.labels" . | nindent 4 }}
data:
  {{- $gatewayConfig := .Files.Get "files/service/marie-gateway-4.0.0.yml" }}
  {{- $gatewayConfig = replace "__ETCD_HOST__" (printf "%s-etcd" .Release.Name) $gatewayConfig }}
  {{- $gatewayConfig = replace "__CLICKHOUSE_HOST__" (printf "%s-clickhouse" .Release.Name) $gatewayConfig }}
  {{- $gatewayConfig = replace "__OTEL_HOST__" "localhost" $gatewayConfig }}
  {{- $gatewayConfig = replace "__OTEL_ENDPOINT__" "http://localhost:4317" $gatewayConfig }}
  {{- $gatewayConfig = replace "__LLM_TRACKING_ENABLED__" (ternary "true" "false" .Values.llmTracking.enabled) $gatewayConfig }}
  marie-gateway-4.0.0.yml: |
{{ $gatewayConfig | indent 4 }}
  marie.yml: |
    jtype: Flow
    version: '1'
    protocol: grpc
    port: {{ .Values.service.port }}

    shared_config:
      storage:
        psql:
          {{- if $postgresql.enabled }}
          enabled: true
          hostname: {{ printf "%s-postgresql" .Release.Name }}
          port: 5432
          database: {{ $postgresqlAuth.database | default "marie_scheduler" }}
          username: {{ $postgresqlAuth.username | default "postgres" }}
          {{- else if $postgresqlExternal.host }}
          enabled: true
          hostname: {{ $postgresqlExternal.host }}
          port: {{ $postgresqlExternal.port | default 5432 }}
          database: {{ $postgresqlExternal.database | default "marie" }}
          username: {{ $postgresqlExternal.username | default "marie" }}
          {{- else }}
          enabled: false
          {{- end }}

        s3:
          {{- if $minio.enabled }}
          enabled: true
          endpoint_url: http://{{ printf "%s-minio" .Release.Name }}:{{ $minio.port | default 8000 }}
          bucket_name: {{ $minio.defaultBuckets | default "marie" }}
          region: us-east-1
          insecure: true
          addressing_style: path
          {{- else if eq ($storage.type | default "") "s3" }}
          enabled: true
          bucket_name: {{ $storageS3.bucket | default $minioExternal.bucket | default "marie" }}
          region: {{ $storageS3.region | default "us-east-1" }}
          {{- if or $storageS3.endpoint $minioExternal.endpoint }}
          endpoint_url: {{ $storageS3.endpoint | default $minioExternal.endpoint }}
          {{- end }}
          {{- else }}
          enabled: false
          {{- end }}

      discovery:
        {{- if $etcd.enabled }}
        etcd:
          enabled: true
          endpoints:
            - {{ printf "http://%s-etcd:2379" .Release.Name }}
        {{- else if $etcdExternal.endpoints }}
        etcd:
          enabled: true
          endpoints:
            {{- range $endpoint := $etcdExternal.endpoints }}
            - {{ $endpoint }}
            {{- end }}
        {{- else }}
        etcd:
          enabled: false
        {{- end }}

      messaging:
        {{- if $rabbitmq.enabled }}
        rabbitmq:
          enabled: true
          hostname: {{ printf "%s-rabbitmq" .Release.Name }}
          port: 5672
        {{- else if $rabbitmqExternal.host }}
        rabbitmq:
          enabled: true
          hostname: {{ $rabbitmqExternal.host }}
          port: {{ $rabbitmqExternal.port | default 5672 }}
        {{- else }}
        rabbitmq:
          enabled: false
        {{- end }}

    toast:
      native:
        enabled: true
      {{- if or $rabbitmq.enabled $rabbitmqExternal.host }}
      rabbitmq:
        enabled: true
      {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "server.fullname" . }}-scheduler-sql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "server.labels" . | nindent 4 }}
data:
  {{- range $path, $_ := .Files.Glob "files/psql/**" }}
  {{ $path | replace "/" "__" }}: |-
{{ $.Files.Get $path | indent 4 }}
  {{- end }}
{{- end }}
