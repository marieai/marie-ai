# Marie-AI Server subchart values
# Runs `marie server --start` which combines gateway and scheduler

global:
  imageRegistry: ""
  imagePullSecrets: []
  serviceAccount:
    create: true
    name: ""
  marie:
    image:
      repository: marieai/marie
      tag: "5.0.3-cuda"
      digest: ""
    logging:
      level: INFO
    debugQueryPlanner: "FALSE"
  grpc:
    trace: ""
    verbosity: ""
  openai:
    apiBase: ""
    apiKey: ""
    existingSecret: ""
    existingSecretApiKeyKey: api-key
  schedulerTrace:
    enabled: false
    path: /tmp/marie-scheduler-trace.jsonl
  valkey:
    enabled: false
    host: ""
    port: 6379
    database: 0
    tls: false
    auth:
      enabled: false
      existingSecret: ""
      existingSecretPasswordKey: password
  llmQueue:
    enabled: false
    poolId: default
    fabricGroupId: default
    gatewayId: default
    producerId: ""
    producerTtlSeconds: 30
    producerRefreshIntervalSeconds: 10
    replyQueueTtlSeconds: 300
    replyPopTimeoutSeconds: "1.0"
    dispatchPopTimeoutSeconds: "1.0"
    maxBatchItems: 8
    maxBatchWaitMs: 100
    maxBufferedRequestsPerPool: 32
    maxInlinePayloadBytes: "16777216"

enabled: true
replicas: 1
progressDeadlineSeconds: 600

llmTracking:
  enabled: true

image:
  repository: marieai/marie-gateway
  tag: "5.0.3-cpu"
  digest: ""
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  # gRPC port
  port: 52000
  # HTTP port for REST API
  httpPort: 51000
  annotations: {}
  nodePorts:
    grpc: ""
    http: ""

# Marie server configuration
config:
  # Path to bootstrap gateway config file (mounted via ConfigMap)
  configFile: /etc/marie/config/service/marie-gateway-4.0.0.yml
  extraSearchPaths: /etc/marie/config/extra_py_modules
  # SQL schema files are packaged by this chart for gateway images that do not
  # include the scheduler fixtures.
  psqlDir: /marie/config/psql
  schemaDir: /marie/config/psql/schema
  metrics:
    enabled: true
    exporterHost: localhost
    exporterPort: 4317
  tracing:
    enabled: true
    exporterHost: localhost
    exporterPort: 4317
  # Additional CLI arguments
  args: []

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# Ingress configuration
ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: marie.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# Autoscaling (disabled by default per user requirement)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

# Persistence for server state
persistence:
  enabled: false
  storageClass: ""
  size: 10Gi
  accessModes:
    - ReadWriteOnce

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext: {}
securityContext: {}

# Health check configuration
probes:
  startup:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    path: /status
