# ClickHouse subchart values
# Column-oriented analytics database for OLAP workloads
# Used by: marie-ai, marie-studio

enabled: false
replicas: 1

image:
  repository: clickhouse/clickhouse-server
  tag: "25.12.1.649"
  digest: "sha256:7234d193fbeb3a375f21f0bb99040396f68bb2e82cada4f4947d7fcf9638bbf3"
  pullPolicy: IfNotPresent

# Service configuration
service:
  type: ClusterIP
  # HTTP interface
  httpPort: 8123
  # Native TCP protocol
  nativePort: 9000
  # MySQL wire protocol
  mysqlPort: 9004
  annotations: {}

# Observability schema (database "telemetry": logs, traces, metrics, and the views and
# columns marie-studio queries). Applied by a Job after install and upgrade.
schema:
  enabled: true
  backoffLimit: 6
  # Maximum total Job lifetime, including readiness waits and retries.
  activeDeadlineSeconds: 300

queryExplorer:
  enabled: false
  readerSecret:
    name: ""
    key: password

# ClickHouse configuration
config:
  # Default database to create
  defaultDatabase: telemetry
  # Default user
  defaultUser: marie
  # Default password (empty for local dev, set in production)
  defaultPassword: ""
  # Enable SQL-driven access management
  accessManagement: true
  # Maximum memory usage (bytes)
  maxMemoryUsage: "4000000000"
  # Maximum memory per user (bytes)
  maxMemoryUsageForUser: "3000000000"
  # Log level: trace, debug, information, warning, error
  logLevel: information

resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "4"
    memory: "8Gi"

# Persistence for ClickHouse data
persistence:
  enabled: true
  storageClass: ""
  size: 50Gi
  accessModes:
    - ReadWriteOnce
  # Separate volume for logs (optional)
  logs:
    enabled: false
    size: 10Gi

nodeSelector: {}
tolerations: []
affinity: {}

podSecurityContext:
  fsGroup: 101

securityContext:
  runAsUser: 101
  runAsGroup: 101

# Health check configuration
probes:
  startup:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 30
  liveness:
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 10
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5

# Pod annotations
podAnnotations: {}
