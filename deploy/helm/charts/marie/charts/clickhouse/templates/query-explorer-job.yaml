{{- if and .Values.enabled .Values.schema.enabled .Values.queryExplorer.enabled (eq (include "marie.lifecycleSuspended" .) "false") }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clickhouse.fullname" . }}-query-schema
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
data:
  views.sql: |
{{ .Files.Get "files/query-explorer-views.sql" | indent 4 }}
  bootstrap.sh: |
{{ .Files.Get "files/query-explorer-bootstrap.sh" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "clickhouse.fullname" . }}-query-schema
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.schema.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.schema.activeDeadlineSeconds }}
  template:
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: apply-query-schema
          image: {{ include "clickhouse.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/bin/sh, /query-explorer/bootstrap.sh]
          env:
            - name: CLICKHOUSE_HOST
              value: {{ include "clickhouse.fullname" . | quote }}
            - name: CLICKHOUSE_USER
              value: {{ default .Values.config.defaultUser .Values.queryExplorer.bootstrapUser | quote }}
            - name: CLICKHOUSE_ADMIN_PASSWORD_FILE
              value: /run/query-bootstrap/password
            - name: QUERY_READER_PASSWORD_FILE
              value: /run/query-reader/password
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - {name: schema, mountPath: /query-explorer, readOnly: true}
            - {name: bootstrap, mountPath: /run/query-bootstrap, readOnly: true}
            - {name: reader, mountPath: /run/query-reader, readOnly: true}
      volumes:
        - name: schema
          configMap:
            name: {{ include "clickhouse.fullname" . }}-query-schema
        - name: bootstrap
          secret:
            secretName: {{ required "queryExplorer.bootstrapSecret.name is required" .Values.queryExplorer.bootstrapSecret.name | quote }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.queryExplorer.bootstrapSecret.key | quote }}, path: password}
        - name: reader
          secret:
            secretName: {{ required "queryExplorer.readerSecret.name is required" .Values.queryExplorer.readerSecret.name | quote }}
            defaultMode: 0440
            items:
              - {key: {{ .Values.queryExplorer.readerSecret.key | quote }}, path: password}
{{- end }}
