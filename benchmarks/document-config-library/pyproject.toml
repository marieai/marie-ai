[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marie-document-config-library"
version = "0.1.0"
description = "Validated import and qualification boundary for document configuration candidates"
requires-python = ">=3.12,<3.13"
dependencies = ["marie-ai", "pyyaml>=5.3.1"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
