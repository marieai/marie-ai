[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marie-longextract"
version = "0.1.0"
description = "Marie LongExtractBench planner and benchmark integration"
requires-python = ">=3.12,<3.13"
dependencies = ["marie-ai"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../.."]
