# Merge this executor entry into the deployment serving LongExtractBench.
executors:
  - name: annotator_llm
    uses:
      jtype: DocumentAnnotatorLLMExecutor
      metas:
        py_modules:
          - marie.executor.extract
      with:
        parsers:
          load_core_components: true
          external_component_modules:
            - marie_longextract.context_providers

  - name: annotator_parser
    uses:
      jtype: DocumentAnnotatorParserExecutor
      metas:
        py_modules:
          - marie.executor.extract
      with:
        parsers:
          load_core_components: true
          external_component_modules:
            - marie_longextract.parsers
