name: Manual Release
env:
  PYTHON_VERSION: '3.12'

on:
  workflow_dispatch:
    inputs:
      release_token:
        description: 'Your release token'
        required: true
      release_reason:
        description: 'Short reason for this manual release'
        required: true

# echo "Trick to echo GitHub Actions Secret:  "
# echo ${{secrets.MARIE_CORE_RELEASE_TOKEN}} | sed 's/./& /g'
# echo ${{secrets.MARIE_DEV_BOT}} | sed 's/./& /g'

jobs:
  token-check:
    runs-on: ubuntu-latest
    steps:
      - name: Test with inputs
        run: |
            echo "The GitHub Action Secret will be masked:  "
            echo "Release reason :  ${{ github.event.inputs.release_reason }}"
            
            if [ "${{ github.event.inputs.release_token }}" != "${{ secrets.MARIE_CORE_RELEASE_TOKEN }}" ]; then
                echo "Wrong release tokens" 
                exit 1
            fi
      - name: Check release token
        id: token-check
        run: | 
          echo "Checking release token"
          touch SUCCESS
        if: inputs.release_token == env.release_token
        env:
          release_token: ${{ secrets.MARIE_CORE_RELEASE_TOKEN }}
      - name: Fail release token
        run: |
          [[ -f SUCCESS ]]          

  regular-release:
    needs: [token-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.MARIE_DEV_BOT }}
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v6
      - run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Manual releases must run from main, not ${GITHUB_REF_NAME}"
            exit 1
          fi
          git config user.email "dev-bot@marieai.co"
          git config user.name "Marie Dev Bot"
          git checkout -B "${GITHUB_REF_NAME}" "origin/${GITHUB_REF_NAME}"
          git branch --set-upstream-to="origin/${GITHUB_REF_NAME}" "${GITHUB_REF_NAME}"
          ./scripts/release.sh final --skip-build --yes --no-publish
          uv build --sdist
          uv publish dist/*
          export RELEASE_VER="$(./scripts/update-version.sh --current)"
          envsubst < .github/slack-pypi.json | \
            curl --fail-with-body -X POST -H 'Content-type: application/json' \
              --data @- "$MARIE_SLACK_WEBHOOK"
        env:
          UV_PUBLISH_USERNAME: ${{ secrets.TWINE_USERNAME }}
          UV_PUBLISH_PASSWORD: ${{ secrets.TWINE_PASSWORD }}
          MARIE_SLACK_WEBHOOK: ${{ secrets.MARIE_SLACK_WEBHOOK }}
      - if: failure()
        run: echo "nothing to release"
      - name: Push release commit and tag
        uses: ad-m/github-push-action@v0.6.0
        with:
          github_token: ${{ secrets.MARIE_DEV_BOT }}
          tags: true
          branch: ${{ github.ref }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.MARIE_DEV_BOT }}
        run: |
          command -v gh >/dev/null || {
            echo "GitHub CLI is required: https://cli.github.com/manual/installation"
            exit 1
          }
          release_version="$(./scripts/update-version.sh --current)"
          tag="v${release_version}"
          gh release create "${tag}" \
            --verify-tag \
            --title "Marie AI ${release_version}" \
            --notes-from-tag
